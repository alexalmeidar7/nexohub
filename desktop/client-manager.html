<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>House Mix Desktop — Clientes</title>
<style>
:root{color-scheme:dark;font-family:Inter,Segoe UI,Arial,sans-serif;background:#0b1020;color:#f5f7ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#17275a 0,transparent 45%),#0b1020;min-height:100vh}main{max-width:820px;margin:auto;padding:42px 34px}.brand{font-size:12px;letter-spacing:.18em;color:#8ea8ff;font-weight:700}h1{font-size:30px;margin:12px 0 6px}.sub{color:#a8b2ca;margin:0 0 28px}.panel{background:#121a2d;border:1px solid #263453;border-radius:18px;padding:22px;margin-bottom:18px}form{display:flex;gap:10px}input{flex:1;min-width:0;background:#0b1222;border:1px solid #334365;border-radius:10px;padding:13px 14px;color:white;font-size:14px}button{border:0;border-radius:10px;padding:12px 17px;font-weight:700;cursor:pointer;background:#3767f5;color:white}button:hover{filter:brightness(1.12)}button.secondary{background:#253656;color:#dbe5ff}.list{display:grid;gap:10px}.client{display:flex;align-items:center;justify-content:space-between;gap:16px;background:#0d1527;border:1px solid #263453;border-radius:12px;padding:14px 15px}.client strong{display:block}.client small{color:#8f9db8}.empty{color:#9aa8c4;text-align:center;padding:28px 10px}.note{font-size:12px;color:#8190ae;margin-top:18px}.error{color:#ff8b8b;min-height:18px;font-size:13px;margin-top:10px}
</style></head><body><main><div class="brand">NEXO BRASIL · HOUSE MIX</div><h1>Seus ambientes</h1><p class="sub">Cada rádio abre em uma área independente, com sessão e armazenamento próprios.</p>
<section class="panel"><h2 style="font-size:17px;margin:0 0 14px">Adicionar cliente</h2><form id="create"><input id="name" maxlength="80" placeholder="Ex.: Rádio Positiva" autocomplete="off" required><button type="submit">Adicionar</button></form><div class="error" id="error"></div></section>
<section class="panel"><h2 style="font-size:17px;margin:0 0 14px">Clientes cadastrados</h2><div class="list" id="clients"><div class="empty">Carregando...</div></div></section><p class="note">Ambientes isolados neste computador. O cadastro local não substitui o pareamento e a autorização do servidor.</p></main>
<script>
const list=document.getElementById("clients"),error=document.getElementById("error");function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
async function refresh(){try{const clients=await window.houseMixClientManager.list();list.innerHTML=clients.length?clients.map(c=>'<div class="client"><div><strong>'+esc(c.name)+'</strong><small>'+esc(c.id)+'</small></div><button class="secondary" data-id="'+esc(c.id)+'">Abrir ambiente</button></div>').join(""):'<div class="empty">Nenhum cliente cadastrado. Adicione o primeiro acima.</div>';list.querySelectorAll("button[data-id]").forEach(b=>b.addEventListener("click",async()=>{try{await window.houseMixClientManager.open(b.dataset.id)}catch(e){error.textContent=e.message||"Não foi possível abrir o cliente."}}));}catch(e){list.innerHTML='<div class="empty">Não foi possível carregar os clientes.</div>';error.textContent=e.message||""}}
document.getElementById("create").addEventListener("submit",async e=>{e.preventDefault();error.textContent="";const input=document.getElementById("name");try{await window.houseMixClientManager.create(input.value);input.value="";await refresh()}catch(e){error.textContent=e.message||"Não foi possível cadastrar."}});refresh();
</script></body></html>
