<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00dbff" />
      <stop offset="100%" stop-color="#0088cc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Stylized "IN" symbol icon -->
  <g transform="translate(15, 25)">
    <!-- Rounded badge background -->
    <rect x="0" y="0" width="150" height="150" rx="36" fill="#002132" stroke="#00dbff" stroke-width="4" />
    <!-- Dynamic 'i' and 'N' lightning slash -->
    <path d="M 45 40 L 45 110" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />
    <circle cx="45" cy="22" r="9" fill="#00dbff" />
    <!-- 'N' polygon -->
    <path d="M 75 110 L 75 40 L 115 110 L 115 40" fill="none" stroke="url(#cyanGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography: INTERATIVA -->
  <text x="185" y="95" font-family="'Montserrat', 'Impact', sans-serif" font-weight="900" font-size="48" letter-spacing="2" fill="#002132">
    INTERATIVA
  </text>
  
  <!-- Frequency Pill Badge: 94.9 FM -->
  <g transform="translate(185, 115)">
    <rect x="0" y="0" width="180" height="42" rx="21" fill="url(#cyanGrad)" />
    <text x="90" y="28" font-family="'Montserrat', sans-serif" font-weight="900" font-size="22" letter-spacing="3" fill="#ffffff" text-anchor="middle">
      94.9 FM
    </text>
  </g>
  
  <text x="380" y="142" font-family="'Montserrat', sans-serif" font-weight="700" font-size="16" letter-spacing="2" fill="#64748B">
    GOIÂNIA
  </text>
</svg>
