name: Deploy House Mix XML and data Edge Functions

on:
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: "Digite exatamente o Project Ref do backend ativo do House Mix"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-xml-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate target backend
        env:
          INPUT_PROJECT_REF: ${{ inputs.confirm_project_ref }}
          SECRET_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SECRET_PROJECT_REF" || { echo "::error::Configure SUPABASE_PROJECT_REF nos GitHub Actions secrets."; exit 1; }
          test "$INPUT_PROJECT_REF" = "$SECRET_PROJECT_REF" || { echo "::error::O Project Ref confirmado não corresponde ao segredo. Deploy cancelado."; exit 1; }
          test -n "$ACCESS_TOKEN" || { echo "::error::Configure SUPABASE_ACCESS_TOKEN nos GitHub Actions secrets."; exit 1; }

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy XML feed functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          for function_name in serve-xml-geral serve-xml-tempo serve-xml-roteiro-estudio serve-xml-cenarios-estudio serve-xml-broadcast serve-xml-vmix-live serve-xml-logos serve-xml-enquete serve-xml-batalha serve-xml-quiz collect-audience update-weather-xml public-cenario-data public-player-data get-music-curiosity; do
            supabase functions deploy "$function_name" --project-ref "$PROJECT_REF" --use-api
          done
