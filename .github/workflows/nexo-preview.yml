name: Nexo Preview Windows Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nexo-preview/**"
      - ".github/workflows/nexo-preview.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: nexo-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nexo-preview/package.json
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run dist
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-Preview-Windows-Installer
          path: nexo-preview/release/*.exe
          if-no-files-found: error
          retention-days: 30
