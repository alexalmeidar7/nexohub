name: Build NexoHub Bridge (Windows)
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "tools/NexoHubBridge/**"
      - ".github/workflows/build-nexohub-bridge.yml"
  push:
    paths:
      - "tools/NexoHubBridge/**"
      - ".github/workflows/build-nexohub-bridge.yml"
    branches: [main, feat/real-ndi-network-discovery]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - name: Generate Windows application icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $source = [System.Drawing.Image]::FromFile("$PWD/src/assets/logo-nexo.png")
          $bitmap = New-Object System.Drawing.Bitmap 256,256
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.Clear([System.Drawing.Color]::Transparent)
          $graphics.DrawImage($source,0,0,256,256)
          $icon = [System.Drawing.Icon]::FromHandle($bitmap.GetHicon())
          $stream = [System.IO.File]::Create("$PWD/tools/NexoHubBridge/bridge.ico")
          $icon.Save($stream)
          $stream.Dispose()
          $icon.Dispose()
          $graphics.Dispose()
          $bitmap.Dispose()
          $source.Dispose()
      - name: Publish standalone Windows executable
        run: dotnet publish tools/NexoHubBridge/NexoHubBridge.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:ApplicationIcon=bridge.ico -o artifacts/NexoHubBridge
      - name: Add configuration template and guide
        shell: pwsh
        run: |
          Copy-Item tools/NexoHubBridge/appsettings.example.json artifacts/NexoHubBridge/appsettings.example.json
          @'
          NexoHub Bridge — descoberta NDI
          1. Instale o NDI Runtime oficial x64.
          2. Copie appsettings.example.json para appsettings.json.
          3. Configure o pareamento remoto apenas se for usar o relay vMix.
          4. Execute NexoHubBridge.exe e mantenha-o aberto.
          5. A descoberta local fica em http://127.0.0.1:8765/ndi/sources.
          '@ | Set-Content artifacts/NexoHubBridge/LEIA-ME.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NexoHubBridge-Windows-x64
          path: artifacts/NexoHubBridge/*
          if-no-files-found: error
          retention-days: 30
