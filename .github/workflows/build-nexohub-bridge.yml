name: Build NexoHub Bridge (Windows)
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "tools/NexoHubBridge/**"
      - "supabase/functions/execute-vmix-commands/**"
      - "supabase/functions/vmix-bridge-*/**"
      - "supabase/functions/vmix-proxy/**"
      - "supabase/functions/_shared/**"
      - "supabase/migrations/**"
      - ".github/workflows/build-nexohub-bridge.yml"
  push:
    paths:
      - "tools/NexoHubBridge/**"
      - "supabase/functions/execute-vmix-commands/**"
      - "supabase/functions/vmix-bridge-*/**"
      - "supabase/functions/vmix-proxy/**"
      - "supabase/functions/_shared/**"
      - "supabase/migrations/**"
      - ".github/workflows/build-nexohub-bridge.yml"
    branches: [main, feat/real-ndi-network-discovery, feature/nexohub-bridge]
permissions:
  contents: read
jobs:
  validate-edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check NexoHub Bridge Edge Functions
        run: |
          deno check \
            supabase/functions/vmix-bridge-pairing/index.ts \
            supabase/functions/vmix-bridge-connect/index.ts \
            supabase/functions/vmix-bridge-poll/index.ts \
            supabase/functions/vmix-bridge-result/index.ts \
            supabase/functions/vmix-proxy/index.ts \
            supabase/functions/execute-vmix-commands/index.ts
  build:
    needs: validate-edge
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - name: Publish standalone Windows executable
        run: dotnet publish tools/NexoHubBridge/NexoHubBridge.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/NexoHubBridge
      - name: Add configuration template and guide
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/NexoHubBridge/Configuração | Out-Null
          Copy-Item tools/NexoHubBridge/Configuração/appsettings.example.json artifacts/NexoHubBridge/Configuração/appsettings.example.json
          Copy-Item tools/NexoHubBridge/Configuração/LEIA-ME.txt artifacts/NexoHubBridge/Configuração/LEIA-ME.txt
          Copy-Item tools/NexoHubBridge/assets/NexoHubBridge.ico artifacts/NexoHubBridge/Configuração/NexoHubBridge.ico
          @'
          NexoHub Bridge — vMix remoto e descoberta NDI
          1. Execute NexoHubBridge.exe no computador onde o vMix está instalado.
          2. Na janela, informe o nome do estúdio e confirme o endereço do vMix (padrão http://127.0.0.1:8088).
          3. Gere o código temporário em House Mix > vMix Control > Ponte remota e cole-o no campo de pareamento.
          4. Clique em Salvar e conectar. O Bridge guarda a credencial no perfil do usuário; não é necessário editar JSON.
          5. Marque Iniciar junto com o Windows se quiser iniciar automaticamente.
          6. Feche a janela para minimizá-la junto ao relógio; use o menu do ícone para abrir ou encerrar.
          7. A descoberta local fica em http://127.0.0.1:8765/ndi/sources. Instale o NDI Runtime oficial x64 para descoberta NDI.
          8. Não compartilhe a pasta de configuração do usuário: ela contém uma credencial secreta.
          O relay remoto exige a migração e as funções do Supabase implantadas.
          '@ | Set-Content artifacts/NexoHubBridge/LEIA-ME.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NexoHubBridge-Windows-x64
          path: artifacts/NexoHubBridge/**
          if-no-files-found: error
          retention-days: 30
