name: Offline First schema smoke test

on:
  pull_request:
    paths:
      - 'infra/offline-first/**'
      - '.github/workflows/offline-first-schema.yml'
  push:
    branches:
      - architecture/house-mix-offline-first
    paths:
      - 'infra/offline-first/**'
      - '.github/workflows/offline-first-schema.yml'

jobs:
  schema-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: housemix_test
          POSTGRES_USER: housemix_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U housemix_test -d housemix_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Desktop HTTPS transport
        run: dotnet build infra/offline-first/desktop-client/HouseMix.OfflineFirst.Transport/HouseMix.OfflineFirst.Transport.csproj --configuration Release
      - name: Build Windows DPAPI vault host
        run: dotnet build infra/offline-first/desktop-client/HouseMix.OfflineFirst.VaultHost/HouseMix.OfflineFirst.VaultHost.csproj --configuration Release
      - uses: oven-sh/setup-bun@v2
      - name: Test per-radio database provisioning primitives
        run: node --test infra/offline-first/api/tests/database-provisioning.test.mjs
      - name: Test PostgreSQL tenant database provisioner
        run: node --test infra/offline-first/api/tests/postgres-tenant-provisioner.test.mjs
      - name: Test tenant schema bootstrap routing
        run: node --test infra/offline-first/api/tests/tenant-schema-bootstrap.test.mjs
      - name: Test tenant runtime credential primitives
        run: node --test infra/offline-first/api/tests/tenant-runtime-credentials.test.mjs
      - name: Test tenant runtime credential rotation
        run: node --test infra/offline-first/api/tests/tenant-runtime-credential-rotation.test.mjs
      - name: Test tenant database activation gate
        run: node --test infra/offline-first/api/tests/tenant-database-activation.test.mjs
      - name: Test tenant runtime database router
        run: node --test infra/offline-first/api/tests/tenant-runtime-router.test.mjs
      - name: Test tenant registry adapter
        run: node --test infra/offline-first/api/tests/tenant-registry-adapter.test.mjs
      - name: Test tenant runtime service composition
        run: node --test infra/offline-first/api/tests/tenant-runtime-service.test.mjs
      - name: Test authenticated tenant HTTP runtime lifecycle
        run: node --test infra/offline-first/api/tests/tenant-runtime-http.test.mjs
      - name: Test authenticated tenant diagnostic route
        run: node --test infra/offline-first/api/tests/tenant-diagnostic-route.test.mjs
      - name: Test tenant-scoped sync HTTP routes
        run: node --test infra/offline-first/api/tests/tenant-sync-routes.test.mjs
      - name: Test DPAPI tenant secret vault host adapter
        run: node --test infra/offline-first/api/tests/dpapi-tenant-secret-vault.test.mjs
      - name: Verify LAN binding remains hard-disabled
        run: node --test infra/offline-first/api/tests/network-config.test.mjs infra/offline-first/api/tests/tls-config.test.mjs infra/offline-first/api/tests/https-handshake.test.mjs
      - name: Apply local schema
        env:
          PGPASSWORD: test-only-password
        run: psql -h localhost -U housemix_test -d housemix_test -v ON_ERROR_STOP=1 -f infra/offline-first/schema/001_local_control_plane.sql
      - name: Apply one-time enrollment migration
        env:
          PGPASSWORD: test-only-password
        run: psql -h localhost -U housemix_test -d housemix_test -v ON_ERROR_STOP=1 -f infra/offline-first/schema/002_one_time_device_enrollment.sql
      - name: Apply tenant database registry migration
        env:
          PGPASSWORD: test-only-password
        run: psql -h localhost -U housemix_test -d housemix_test -v ON_ERROR_STOP=1 -f infra/offline-first/schema/003_tenant_database_registry.sql
      - name: Verify tenant isolation constraints
        env:
          PGPASSWORD: test-only-password
        run: psql -h localhost -U housemix_test -d housemix_test -v ON_ERROR_STOP=1 -f infra/offline-first/schema/tests/tenant_isolation_smoke.sql
      - name: Verify per-radio database registry constraints
        env:
          PGPASSWORD: test-only-password
        run: psql -h localhost -U housemix_test -d housemix_test -v ON_ERROR_STOP=1 -f infra/offline-first/schema/tests/tenant_database_registry_smoke.sql
      - name: Verify isolated tenant sync schema
        env:
          PGPASSWORD: test-only-password
        run: psql -h localhost -U housemix_test -d housemix_test -v ON_ERROR_STOP=1 -f infra/offline-first/schema/tests/tenant_sync_schema_smoke.sql
      - name: Verify durable sync checkpoints
        env:
          PGPASSWORD: test-only-password
        run: psql -h localhost -U housemix_test -d housemix_test -v ON_ERROR_STOP=1 -f infra/offline-first/schema/tests/tenant_sync_checkpoint_smoke.sql
      - name: Verify durable tenant sync inbox
        env:
          PGPASSWORD: test-only-password
        run: psql -h localhost -U housemix_test -d housemix_test -v ON_ERROR_STOP=1 -f infra/offline-first/schema/tests/tenant_sync_inbox_smoke.sql
      - name: Verify tenant inbox processing leases
        env:
          PGPASSWORD: test-only-password
        run: psql -h localhost -U housemix_test -d housemix_test -v ON_ERROR_STOP=1 -f infra/offline-first/schema/tests/tenant_sync_inbox_lease_smoke.sql
      - name: Verify isolated Programas and Agenda domain schema
        env:
          PGPASSWORD: test-only-password
        run: psql -h localhost -U housemix_test -d housemix_test -v ON_ERROR_STOP=1 -f infra/offline-first/schema/tests/tenant_programas_agenda_smoke.sql
      - name: Test authenticated tenant sync inbox
        run: node --test infra/offline-first/api/tests/tenant-sync-inbox.test.mjs
      - name: Test idempotent tenant inbox domain application
        run: node --test infra/offline-first/api/tests/tenant-inbox-domain-applier.test.mjs
      - name: Install API dependencies
        run: bun install --no-save
      - name: Test local API tenant isolation
        env:
          DATABASE_URL: postgres://housemix_test:test-only-password@localhost:5432/housemix_test
        run: node infra/offline-first/api/tests/api-isolation.test.mjs
