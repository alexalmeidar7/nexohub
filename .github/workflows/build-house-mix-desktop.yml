name: Build House Mix Desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop/**"
      - "src/**"
      - "index.html"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - "infra/offline-first/desktop-client/**"
      - ".github/workflows/build-house-mix-desktop.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "src/**"
      - "index.html"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - "infra/offline-first/desktop-client/**"
      - ".github/workflows/build-house-mix-desktop.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish local API host for Windows
        run: dotnet publish infra/offline-first/desktop-client/HouseMix.OfflineFirst.Host/HouseMix.OfflineFirst.Host.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -o desktop/runtime/local-api-host
      - name: Test Desktop shell security
        run: node --test desktop/runtime.test.cjs desktop/local-api-host.test.cjs
      - name: Build Desktop frontend
        run: npm run desktop:build
      - name: Verify packaged entry points
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/index.html")) { throw "Desktop frontend output is missing." }
          if (-not (Test-Path "desktop/main.cjs")) { throw "Electron main process is missing." }
          if (-not (Test-Path "desktop/preload.cjs")) { throw "Electron preload is missing." }
      - name: Package Windows installer
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: House-Mix-Desktop-Windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
