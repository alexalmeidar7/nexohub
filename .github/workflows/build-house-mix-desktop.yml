name: Build House Mix Desktop

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/package-housemix-desktop.ps1'
      - 'desktop/locutor-installer.nsh'
      - '.github/workflows/build-house-mix-desktop.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install local API production dependencies
        run: npm install --prefix infra/offline-first/api --omit=dev --no-audit --no-fund
      - name: Bundle portable Node runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "desktop/runtime/node" | Out-Null
          Copy-Item (Get-Command node).Source "desktop/runtime/node/node.exe" -Force
          if (-not (Test-Path "desktop/runtime/node/node.exe")) { throw "Portable Node runtime is missing." }
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish local API host for Windows
        run: dotnet publish infra/offline-first/desktop-client/HouseMix.OfflineFirst.Host/HouseMix.OfflineFirst.Host.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -o desktop/runtime/local-api-host
      - name: Publish database provisioner for Windows
        run: dotnet publish infra/offline-first/desktop-client/HouseMix.OfflineFirst.Provisioner/HouseMix.OfflineFirst.Provisioner.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -o desktop/runtime/provisioner
      - name: Bundle local database schema
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "desktop/runtime/provisioner/schema" | Out-Null
          Copy-Item "infra/offline-first/schema/*.sql" "desktop/runtime/provisioner/schema/" -Force
      - name: Bundle local API runtime
        # The same integrated worker is included in manual and release installers.
        run: npm run desktop:bundle-local-api
      - name: Bundle NDI discovery and preview worker
        shell: pwsh
        run: ./scripts/bundle-ndi-bridge.ps1
      - name: Test Desktop shell security
        run: node --test desktop/runtime.test.cjs desktop/local-api-host.test.cjs
      - name: Build Desktop frontend
        run: npm run desktop:build
      - name: Verify packaged runtime
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/index.html")) { throw "Desktop frontend output is missing." }
          if (-not (Test-Path "desktop/main.cjs")) { throw "Electron main process is missing." }
          if (-not (Test-Path "desktop/preload.cjs")) { throw "Electron preload is missing." }
          if (-not (Test-Path "desktop/runtime/local-api-host/HouseMix.OfflineFirst.Host.exe")) { throw "Published local API host executable is missing." }
          if (-not (Test-Path "desktop/runtime/provisioner/HouseMix.OfflineFirst.Provisioner.exe")) { throw "Database provisioner executable is missing." }
          if (-not (Test-Path "desktop/runtime/provisioner/schema/001_local_control_plane.sql")) { throw "Local database schema is missing." }
          if (-not (Test-Path "desktop/runtime/provisioner/schema/002_one_time_device_enrollment.sql")) { throw "Device enrollment schema is missing." }
          if (-not (Test-Path "desktop/runtime/node/node.exe")) { throw "Bundled Node runtime is missing." }
          if (-not (Test-Path "desktop/runtime/api/server.mjs")) { throw "Bundled local API is missing." }
          if (-not (Test-Path "infra/offline-first/api/node_modules/express/package.json")) { throw "Local API Express dependency is missing." }
          if (-not (Test-Path "infra/offline-first/api/node_modules/postgres/package.json")) { throw "Local API PostgreSQL client is missing." }
      - name: Package Windows installer
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.HMD_WINDOWS_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.HMD_WINDOWS_CSC_KEY_PASSWORD }}
        run: ./scripts/package-housemix-desktop.ps1
      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: House-Mix-Desktop-Windows-x64
          path: |
            release/*.exe
            release-locutor/*.exe
            release-locutor/*.blockmap
            release-locutor/*.yml
          if-no-files-found: error
          retention-days: 14
