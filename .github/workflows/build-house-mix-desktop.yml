name: Build House Mix Desktop
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - "src/**"
      - "public/**"
      - ".env"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "postcss.config.*"
      - "tailwind.config.*"
      - ".npmrc"
      - ".github/workflows/build-house-mix-desktop.yml"
  push:
    branches: [feature/house-mix-desktop]
    paths:
      - "desktop/**"
      - "src/**"
      - "public/**"
      - ".env"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "postcss.config.*"
      - "tailwind.config.*"
      - ".npmrc"
      - ".github/workflows/build-house-mix-desktop.yml"
permissions:
  contents: read
  actions: read
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Validate Desktop password-reset redirect
        shell: pwsh
        env:
          VITE_DESKTOP_AUTH_REDIRECT_URL: ${{ vars.VITE_DESKTOP_AUTH_REDIRECT_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VITE_DESKTOP_AUTH_REDIRECT_URL)) {
            throw "VITE_DESKTOP_AUTH_REDIRECT_URL is required for packaged password recovery. Configure it in GitHub Actions Variables and authorize the callback in Supabase."
          }
      - name: Build desktop frontend
        env:
          VITE_DESKTOP_AUTH_REDIRECT_URL: ${{ vars.VITE_DESKTOP_AUTH_REDIRECT_URL }}
        run: npm run desktop:build
      - name: Package Windows installer
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: House-Mix-Desktop-Windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
