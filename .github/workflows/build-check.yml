# Verificação automática: monta o projeto a cada envio ao GitHub.
# Se houver erro de compilação, o commit fica marcado com X vermelho
# e o erro aparece aqui, antes de travar a prévia do Lovable.
name: Verificar build

on:
  push:
  pull_request:

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Instalar dependências
        run: bun install

      - name: Verificar tipos (erros de sintaxe e JSX)
        run: bunx --bun -p @typescript/native-preview tsgo -p tsconfig.app.json --noEmit

      - name: Testar resolução de imagens do Desktop
        run: bunx vitest run src/lib/programImageResolver.test.ts src/lib/ownedRealtimeChannel.test.ts src/lib/desktopPromotionBanners.test.ts src/lib/desktopXmlRefresh.test.ts src/components/__tests__/DesktopLocalMediaSync.test.tsx src/lib/vmixRemoteRoom.test.ts src/lib/vmixPreviewSession.test.ts src/components/vmix/StudioPreview.test.tsx

      - name: Testar controle de consumo do Supabase
        run: bunx vitest run src/integrations/supabase/requestBudget.test.ts

      - name: Validar criptografia e sintaxe do login local (HMD)
        run: |
          node --check infra/offline-first/api/server.mjs
          node --check infra/offline-first/api/local-operator-routes.mjs
          node --test infra/offline-first/api/tests/local-operator-password.test.mjs

      - name: Validar provedores de IA locais (sem chamadas pagas)
        run: node --test desktop/local-free-ai.test.cjs desktop/local-whisper.test.cjs desktop/local-transcription-store.test.cjs
      - name: Testar transporte remoto do Desktop
        run: node --test desktop/runtime.test.cjs desktop/vmix-api.test.cjs desktop/ndi-bridge.test.cjs

      - name: Montar a prévia
        run: bun run build

      - name: Validar compilação do NexoHub Bridge
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compilar NexoHub Bridge para Windows
        run: dotnet publish tools/NexoHubBridge/NexoHubBridge.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o /tmp/nexohub-bridge
