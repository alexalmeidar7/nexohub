# Verificação automática: monta o projeto a cada envio ao GitHub.
# Se houver erro de compilação, o commit fica marcado com X vermelho
# e o erro aparece aqui, antes de travar a prévia do Lovable.
name: Verificar build

on:
  push:
  pull_request:

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Instalar dependências (retry para limites temporários do registry)
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4; do
            if bun install; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              sleep $((attempt * 15))
            fi
          done
          echo "::error::bun install falhou após 4 tentativas; verifique disponibilidade ou rate limit do registry."
          exit 1

      - name: Verificar tipos (erros de sintaxe e JSX)
        run: bunx --bun -p @typescript/native-preview tsgo -p tsconfig.app.json --noEmit

      - name: Montar a prévia
        run: bun run build

      - name: Preparar .NET para validar o Bridge (se o projeto estiver nesta branch)
        if: hashFiles('tools/NexoHubBridge/NexoHubBridge.csproj') != ''
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validar compilação do NexoHub Bridge para Windows (se disponível)
        if: hashFiles('tools/NexoHubBridge/NexoHubBridge.csproj') != ''
        run: dotnet publish tools/NexoHubBridge/NexoHubBridge.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o /tmp/nexohub-bridge
