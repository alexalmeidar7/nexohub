# Verificação automática: monta o projeto a cada envio ao GitHub.
# Se houver erro de compilação, o commit fica marcado com X vermelho
# e o erro aparece aqui, antes de travar a prévia do Lovable.
name: Verificar build

on:
  push:
  pull_request:

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Instalar dependências (retry para rate limit transitório)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if bun install; then
              exit 0
            else
              status=$?
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "bun install falhou após 3 tentativas."
              exit "$status"
            fi
            echo "bun install falhou na tentativa $attempt/3; aguardando antes de repetir..."
            sleep $((attempt * 15))
          done

      - name: Verificar tipos (erros de sintaxe e JSX)
        run: bunx --bun -p @typescript/native-preview tsgo -p tsconfig.app.json --noEmit

      - name: Montar a prévia
        run: bun run build

      - name: Configurar Deno para Edge Functions Google Agenda
        if: ${{ hashFiles('supabase/functions/google-calendar-*/index.ts') != '' }}
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validar sintaxe e tipos das Edge Functions Google Agenda
        if: ${{ hashFiles('supabase/functions/google-calendar-*/index.ts') != '' }}
        run: |
          deno check --node-modules-dir=none --no-lock \
            supabase/functions/google-calendar-auth/index.ts \
            supabase/functions/google-calendar-callback/index.ts \
            supabase/functions/google-calendar-events/index.ts \
            supabase/functions/google-calendar-disconnect/index.ts

      - name: Validar compilação do NexoHub Bridge
        if: ${{ hashFiles('tools/NexoHubBridge/NexoHubBridge.csproj') != '' }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Compilar NexoHub Bridge para Windows
        if: ${{ hashFiles('tools/NexoHubBridge/NexoHubBridge.csproj') != '' }}
        run: dotnet publish tools/NexoHubBridge/NexoHubBridge.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o /tmp/nexohub-bridge
