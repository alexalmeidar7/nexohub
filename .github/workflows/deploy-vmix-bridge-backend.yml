                ('estudio', 'text', 'YES'),
                ('color', 'text', 'YES'),
                ('category', 'text', 'NO'),
                ('data_especifica', 'date', 'YES')
            )
            SELECT COALESCE(string_agg(r.column_name, ', ' ORDER BY r.column_name), '')
            FROM required r
            LEFT JOIN information_schema.columns c
              ON c.table_schema = 'public'
             AND c.table_name = 'custom_vmix_buttons'
             AND c.column_name = r.column_name
            WHERE c.column_name IS NULL
               OR c.data_type <> r.data_type
               OR c.is_nullable <> r.is_nullable
          ")"
          if [ -n "$missing_or_wrong_columns" ]; then
