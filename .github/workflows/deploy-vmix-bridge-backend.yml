          ORDER BY r.group_name;
          
          WITH required(bucket_id, expected_public) AS (
            VALUES
              ('empresa-assets', true),
              ('comercial', true),
              ('programas', true),
              ('xml-files', true),
              ('entregas', false)
          )
          SELECT
            r.bucket_id,
            CASE
              WHEN b.id IS NULL THEN 'missing'
              WHEN b.public IS DISTINCT FROM r.expected_public
                THEN 'visibility mismatch (expected public=' || r.expected_public::text || ', actual=' || b.public::text || ')'
              ELSE 'ok'
            END AS status
          FROM required r
          LEFT JOIN storage.buckets b ON b.id = r.bucket_id
          ORDER BY r.bucket_id;
          
