name: Deploy NexoHub vMix Bridge backend (manual)

on:
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: "Digite exatamente o Project Ref do backend ativo; nada será publicado se não corresponder ao segredo configurado."
        required: true
        type: string
      apply_changes:
        description: "Marque somente após aprovação explícita para aplicar migrações e publicar as funções Edge."
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: vmix-bridge-backend-manual
  cancel-in-progress: false

jobs:
  deploy-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate target project and credentials
        env:
          INPUT_PROJECT_REF: ${{ inputs.confirm_project_ref }}
          SECRET_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Fail closed: this Bridge workflow is bound to the project configured in supabase/config.toml.
          if ! EXPECTED_PROJECT_REF="$(python3 - <<'PY'
          import tomllib
          with open("supabase/config.toml", "rb") as config_file:
              print(tomllib.load(config_file).get("project_id", ""))
          PY
          )"; then
            echo "::error::Could not read project_id from supabase/config.toml. Nothing was changed."
            exit 1
          fi
          if [ -z "$EXPECTED_PROJECT_REF" ]; then
            echo "::error::supabase/config.toml does not define project_id. Nothing was changed."
            exit 1
          fi
          if [ -z "$SECRET_PROJECT_REF" ]; then
            echo "::error::Configure SUPABASE_PROJECT_REF for the verified active backend."
            exit 1
          fi
          if [ "$SECRET_PROJECT_REF" != "$EXPECTED_PROJECT_REF" ]; then
            echo "::error::SUPABASE_PROJECT_REF does not match the repository's configured backend project. Nothing was changed."
            exit 1
          fi
          if [ "$INPUT_PROJECT_REF" != "$EXPECTED_PROJECT_REF" ]; then
            echo "::error::The manually confirmed Project Ref does not match the repository's configured backend project. Nothing was changed."
            exit 1
          fi
          if ! python3 - "$DATABASE_URL" "$SECRET_PROJECT_REF" <<'PY'
          import sys
          from urllib.parse import unquote, urlparse

          database_url, project_ref = sys.argv[1], sys.argv[2]
          parsed = urlparse(database_url)
          host = (parsed.hostname or "").lower()
          username = unquote(parsed.username or "")
          # GitHub-hosted runners may be IPv4-only. Supabase direct database
          # endpoints are IPv6-only unless the project has the IPv4 add-on.
          # Require the project's Supavisor session pooler (IPv4, port 5432)
          # so the read-only preflight and approved psql migrations fail early
          # with a clear message instead of a network-level IPv6 error.
          project_pooler_host = (
              host.endswith(".pooler.supabase.com")
              and username == f"postgres.{project_ref}"
              and parsed.port == 5432
          )
          if parsed.scheme not in ("postgres", "postgresql") or not project_pooler_host:
              sys.exit(1)
          PY
          then
            echo "::error::SUPABASE_DB_URL must use the confirmed project's Supavisor session pooler (IPv4, port 5432) with username postgres.<project_ref>. Direct IPv6 endpoints are not accepted on GitHub-hosted runners. Nothing was changed."
            exit 1
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Configure SUPABASE_ACCESS_TOKEN. Nothing was published."
            exit 1
          fi

      - name: Require frontend and Bridge backend to target the same project before writes
        if: ${{ inputs.apply_changes }}
        env:
          EXPECTED_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$EXPECTED_PROJECT_REF" <<'PY'
          import sys
          from pathlib import Path

          expected_project = sys.argv[1]
          values = {}
          for raw_line in Path(".env").read_text(encoding="utf-8").splitlines():
              line = raw_line.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key, value = line.split("=", 1)
              key = key.strip()
              if key in {"VITE_SUPABASE_PROJECT_ID", "VITE_SUPABASE_URL"}:
                  values[key] = value.strip().strip('"').strip("'").rstrip("/")

          expected_url = f"https://{expected_project}.supabase.co"
          actual_project = values.get("VITE_SUPABASE_PROJECT_ID", "")
          actual_url = values.get("VITE_SUPABASE_URL", "")
          if actual_project != expected_project or actual_url != expected_url:
              print("::error::The browser Supabase client and Bridge backend target different projects.")
              print(f"Frontend VITE_SUPABASE_PROJECT_ID: {actual_project or 'missing'}")
              print(f"Frontend VITE_SUPABASE_URL: {actual_url or 'missing'}")
              print(f"Bridge backend project: {expected_project}")
              print("Align the frontend .env and supabase/config.toml with the approved backend before any write or Edge deployment.")
              sys.exit(1)
          print(f"Frontend and Bridge backend both target {expected_project}.")
          PY

      - name: Verify Supabase access token can read the confirmed project (read-only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header "Accept: application/json" \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}")"
          if [ "$status" != "200" ]; then
            echo "::error::Supabase API token cannot read the confirmed project (HTTP ${status}). Nothing was changed."
            exit 1
          fi

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Require restored migration source files before writes
        if: ${{ inputs.apply_changes }}
        shell: bash
        run: |
          set -euo pipefail
          required_versions=(
            20261028003932
            20261028025459
            20261028025525
            20261028030056
            20261028030116
            20261028030144
            20261028104022
            20261028123803
            20261028124350
            20261028124413
            20261028124449
            20261028125121
            20261028132309
            20261028172338
            20261028180000
            20261028193000
            20261028205300
            20261028223300
            20261029025000
          )
          for version in "${required_versions[@]}"; do
            matches=(supabase/migrations/"${version}"_*.sql)
            if [ "${#matches[@]}" -ne 1 ] || [ ! -s "${matches[0]}" ]; then
              echo "::error::Missing or ambiguous source migration for ${version}. Recover and commit the original SQL under supabase/migrations before any Bridge write."
              exit 1
            fi
          done

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Preflight restored House Mix baseline and Bridge schema (read-only)
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $preflight$
          DECLARE
            missing_house_mix_migrations text;
            missing_core_tables text;
            bridge_table_count integer;
            bridge_migration_applied boolean;
            missing_columns text;
            status_constraint text;
            rls_missing text;
          BEGIN
            IF to_regclass('supabase_migrations.schema_migrations') IS NULL THEN
              RAISE EXCEPTION 'Supabase migration history is missing. Stop and restore/reconcile the House Mix database first.';
            END IF;

            -- Require every House Mix restoration/security migration currently recorded on the configured project.
            WITH required(version) AS (
              VALUES
                ('20261028003932'),
                ('20261028025459'),
                ('20261028025525'),
                ('20261028030056'),
                ('20261028030116'),
                ('20261028030144'),
                ('20261028104022'),
                ('20261028123803'),
                ('20261028124350'),
                ('20261028124413'),
                ('20261028124449'),
                ('20261028125121'),
                ('20261028132309'),
                ('20261028172338')
            )
            SELECT string_agg(r.version, ', ' ORDER BY r.version)
              INTO missing_house_mix_migrations
            FROM required r
            WHERE NOT EXISTS (
              SELECT 1 FROM supabase_migrations.schema_migrations m
              WHERE m.version = r.version
            );

            IF missing_house_mix_migrations IS NOT NULL THEN
              RAISE EXCEPTION 'House Mix restoration history is incomplete; missing migration versions: %. Nothing was changed.', missing_house_mix_migrations;
            END IF;

            WITH required(table_name) AS (
              VALUES ('profiles'), ('programas'), ('user_settings'), ('empresa_config')
            )
            SELECT string_agg(r.table_name, ', ' ORDER BY r.table_name)
              INTO missing_core_tables
            FROM required r
            WHERE to_regclass('public.' || r.table_name) IS NULL;

            IF missing_core_tables IS NOT NULL THEN
              RAISE EXCEPTION 'House Mix core tables are missing: %. Restore the House Mix schema before Bridge setup.', missing_core_tables;
            END IF;

            SELECT count(*)
              INTO bridge_table_count
            FROM (VALUES
              ('vmix_bridge_pairings'),
              ('vmix_bridge_devices'),
              ('vmix_bridge_jobs')
            ) AS required(table_name)
            WHERE to_regclass('public.' || required.table_name) IS NOT NULL;

            SELECT EXISTS (
              SELECT 1 FROM supabase_migrations.schema_migrations
              WHERE version = '20261022185000'
            ) INTO bridge_migration_applied;

            IF bridge_table_count NOT IN (0, 3) THEN
              RAISE EXCEPTION 'Partial Bridge schema detected (% of 3 tables). Stop and reconcile manually; no automatic repair is safe.', bridge_table_count;
            END IF;

            IF bridge_migration_applied AND bridge_table_count <> 3 THEN
              RAISE EXCEPTION 'Bridge baseline is recorded as applied but one or more Bridge tables are missing. Stop and reconcile manually.';
            END IF;

            -- A fresh backend may have all House Mix restoration phases but no Bridge
            -- tables yet. That is a valid read-only preflight state. The Bridge baseline
            -- is created only by the separately gated apply_changes=true step below.
            IF bridge_table_count = 3 THEN
              WITH required(table_name, column_name) AS (
                VALUES
                  ('vmix_bridge_pairings', 'id'),
                  ('vmix_bridge_pairings', 'user_id'),
                  ('vmix_bridge_pairings', 'code_hash'),
                  ('vmix_bridge_pairings', 'expires_at'),
                  ('vmix_bridge_pairings', 'used_at'),
                  ('vmix_bridge_pairings', 'created_at'),
                  ('vmix_bridge_devices', 'id'),
                  ('vmix_bridge_devices', 'user_id'),
                  ('vmix_bridge_devices', 'device_name'),
                  ('vmix_bridge_devices', 'token_hash'),
                  ('vmix_bridge_devices', 'revoked'),
                  ('vmix_bridge_devices', 'last_seen_at'),
                  ('vmix_bridge_devices', 'created_at'),
                  ('vmix_bridge_jobs', 'id'),
                  ('vmix_bridge_jobs', 'user_id'),
                  ('vmix_bridge_jobs', 'device_id'),
                  ('vmix_bridge_jobs', 'status'),
                  ('vmix_bridge_jobs', 'result_status'),
                  ('vmix_bridge_jobs', 'result_body'),
                  ('vmix_bridge_jobs', 'created_at'),
                  ('vmix_bridge_jobs', 'started_at'),
                  ('vmix_bridge_jobs', 'completed_at'),
                  ('vmix_bridge_jobs', 'path'),
                  ('vmix_bridge_jobs', 'method'),
                  ('vmix_bridge_jobs', 'body')
              )
              SELECT string_agg(r.table_name || '.' || r.column_name, ', ' ORDER BY r.table_name, r.column_name)
                INTO missing_columns
              FROM required r
              LEFT JOIN information_schema.columns c
                ON c.table_schema = 'public'
               AND c.table_name = r.table_name
               AND c.column_name = r.column_name
              WHERE c.column_name IS NULL;

              IF missing_columns IS NOT NULL THEN
                RAISE EXCEPTION 'Bridge schema is incomplete; missing columns: %', missing_columns;
              END IF;

              SELECT pg_get_constraintdef(oid)
                INTO status_constraint
              FROM pg_constraint
              WHERE conrelid = 'public.vmix_bridge_jobs'::regclass
                AND conname = 'vmix_bridge_jobs_status_check';

              IF status_constraint IS NULL
                 OR position('pending' IN status_constraint) = 0
                 OR position('running' IN status_constraint) = 0
                 OR position('succeeded' IN status_constraint) = 0
                 OR position('failed' IN status_constraint) = 0 THEN
                RAISE EXCEPTION 'Bridge job status constraint is not compatible with the pending/running/succeeded/failed contract.';
              END IF;

              SELECT string_agg(c.relname, ', ' ORDER BY c.relname)
                INTO rls_missing
              FROM pg_class c
              JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname = 'public'
                AND c.relname IN ('vmix_bridge_pairings', 'vmix_bridge_devices', 'vmix_bridge_jobs')
                AND c.relkind IN ('r', 'p')
                AND NOT c.relrowsecurity;

              IF rls_missing IS NOT NULL THEN
                RAISE EXCEPTION 'RLS is not enabled on Bridge tables: %. Stop before deploying Edge Functions.', rls_missing;
              END IF;
            END IF;
          END;
          $preflight$;
          SQL

      - name: Require current main schema reconciliation migrations before Bridge writes
        if: ${{ inputs.apply_changes }}
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          missing="$(psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -tA -c "
            WITH required(version) AS (
              VALUES ('20261028180000'), ('20261028193000'), ('20261028205300'), ('20261028223300'), ('20261029025000')
            )
            SELECT COALESCE(string_agg(r.version, ', ' ORDER BY r.version), '')
            FROM required r
            WHERE NOT EXISTS (
              SELECT 1 FROM supabase_migrations.schema_migrations m
              WHERE m.version = r.version
            );
          ")"
          if [ -n "$missing" ]; then
            echo "::error::Current House Mix schema migrations are not applied: $missing. Apply them separately only after approval; Bridge writes remain blocked."
            exit 1
          fi
          echo "Current House Mix schema reconciliation migrations are recorded."

      - name: Verify Agenda and forms/Storage schema before Bridge writes
        if: ${{ inputs.apply_changes }}
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          missing_columns="$(psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -tA -c "
            WITH required(table_name, column_name) AS (
              VALUES
                ('agenda_eventos', 'artes_urls'),
                ('agenda_eventos', 'edicao_concluida'),
                ('agenda_eventos', 'edicao_notas'),
                ('agenda_eventos', 'excecoes'),
                ('agenda_eventos', 'horario_gravacao'),
                ('agenda_eventos', 'horario_gravacao_fim'),
                ('agenda_eventos', 'periodo_inicio'),
                ('agenda_eventos', 'periodo_fim'),
                ('agenda_eventos', 'status'),
                ('agenda_eventos', 'tipo_evento'),
                ('agenda_eventos', 'youtube_descricao'),
                ('agenda_eventos', 'youtube_titulo'),
                ('agenda_eventos', 'youtube_url'),
                ('ouvintes', 'origem_cadastro'),
                ('ouvintes', 'sexo'),
                ('ouvintes', 'banido'),
                ('ouvintes', 'banido_at'),
                ('ouvintes', 'banido_motivo'),
                ('programas', 'deleted_at'),
                ('logos_patrocinadores', 'nome'),
                ('logos_patrocinadores', 'cnpj'),
                ('logos_patrocinadores', 'telefone'),
                ('logos_patrocinadores', 'endereco'),
                ('logos_patrocinadores', 'excluido'),
                ('logos_patrocinadores', 'excluido_at'),
                ('empresa_config', 'ativo'),
                ('empresa_config', 'created_at'),
                ('empresa_config', 'cnpj'),
                ('empresa_config', 'executiva_venda'),
                ('empresa_config', 'cliente_desde'),
                ('empresa_config', 'plano'),
                ('empresa_config', 'timezone'),
                ('empresa_config', 'background_url'),
                ('empresa_config', 'instagram_subs'),
                ('empresa_config', 'facebook_subs'),
                ('empresa_config', 'youtube_subs'),
                ('empresa_config', 'youtube_api_key'),
                ('empresa_config', 'youtube_channel_id'),
                ('empresa_config', 'audio_sources'),
                ('empresa_config', 'video_sources'),
                ('empresa_config', 'audio_stream_api_url'),
                ('empresa_config', 'audio_stream_xpath'),
                ('empresa_config', 'video_stream_api_url'),
                ('empresa_config', 'video_stream_xpath'),
                ('user_settings', 'cenario_config'),
                ('user_settings', 'dashboard_items'),
                ('user_settings', 'infomusic_ai_enabled'),
                ('user_settings', 'infomusic_ai_last_reset'),
                ('user_settings', 'infomusic_ai_monthly_count'),
                ('user_settings', 'infomusic_excecoes'),
                ('user_settings', 'infomusic_excecoes_artista_url'),
                ('user_settings', 'infomusic_excecoes_capa_url'),
                ('user_settings', 'last_manual_curiosity_id'),
                ('user_settings', 'music_source_device'),
                ('user_settings', 'music_source_mode'),
                ('user_settings', 'shopping_active'),
                ('user_settings', 'vmix_input_mapping'),
                ('user_settings', 'vmix_pass'),
                ('user_settings', 'vmix_shortcuts'),
                ('user_settings', 'vmix_url'),
                ('user_settings', 'vmix_user'),
                ('user_settings', 'weather_city'),
                ('user_settings', 'weather_lat'),
                ('user_settings', 'weather_lon'),
                ('roteiros', 'agendado_para_envio'),
                ('roteiros', 'apresentador_editado'),
                ('roteiros', 'configuracoes'),
                ('roteiros', 'editado_at'),
                ('roteiros', 'enviado_agendamento'),
                ('roteiros', 'share_login'),
                ('roteiros', 'share_token'),
                ('roteiros', 'tickertitulos'),
                ('roteiros', 'xml_pushed_at'),
                ('sorteio_sorteios', 'apresentador_nome'),
                ('sorteio_sorteios', 'programa_id'),
                ('sorteio_sorteios', 'programa_nome'),
                ('sorteio_sorteios', 'entrega_pin'),
                ('sorteio_sorteios', 'entrega_token'),
                ('sorteio_sorteios', 'foto_entrega_url'),
                ('sorteio_sorteios', 'entrega_registrada_em'),
                ('xml_upload_history', 'artista'),
                ('xml_upload_history', 'musica')
            )
            SELECT COALESCE(string_agg(r.table_name || '.' || r.column_name, ', ' ORDER BY r.table_name, r.column_name), '')
            FROM required r
            LEFT JOIN information_schema.columns c
              ON c.table_schema = 'public'
             AND c.table_name = r.table_name
             AND c.column_name = r.column_name
            WHERE c.column_name IS NULL
          ")"
          if [ -n "$missing_columns" ]; then
            echo "::error::Agenda/forms schema is incomplete: $missing_columns. Apply and verify the reviewed additive migrations 20261028180000 and 20261028193000 before Bridge writes."
            exit 1
          fi

          delivery_token_nullable="$(psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -tA -c "
            SELECT is_nullable
            FROM information_schema.columns
            WHERE table_schema = 'public'
              AND table_name = 'sorteio_sorteios'
              AND column_name = 'entrega_token'
          ")"
          if [ "$delivery_token_nullable" != "NO" ]; then
            echo "::error::sorteio_sorteios.entrega_token must be NOT NULL after migration 20261028193000."
            exit 1
          fi

          delivery_token_unique="$(psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -tA -c "
            SELECT EXISTS (
              SELECT 1
              FROM pg_index i
              JOIN pg_class idx ON idx.oid = i.indexrelid
              JOIN pg_class tbl ON tbl.oid = i.indrelid
              JOIN pg_namespace n ON n.oid = tbl.relnamespace
              WHERE n.nspname = 'public'
                AND tbl.relname = 'sorteio_sorteios'
                AND idx.relname = 'sorteio_sorteios_entrega_token_key'
                AND i.indisunique
            )
          ")"
          if [ "$delivery_token_unique" != "t" ]; then
            echo "::error::The unique delivery-token index from migration 20261028193000 is missing."
            exit 1
          fi

          missing_buckets="$(psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -tA -c "
            WITH required(bucket_id) AS (
              VALUES ('empresa-assets'), ('comercial'), ('programas'), ('xml-files'), ('entregas')
            )
            SELECT COALESCE(string_agg(r.bucket_id, ', ' ORDER BY r.bucket_id), '')
            FROM required r
            LEFT JOIN storage.buckets b ON b.id = r.bucket_id
            WHERE b.id IS NULL
          ")"
          if [ -n "$missing_buckets" ]; then
            echo "::error::Storage buckets created by migration 20261028193000 are missing: $missing_buckets."
            exit 1
          fi

          bucket_visibility_mismatches="$(psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -tA -c "
            WITH required(bucket_id, expected_public) AS (
              VALUES
                ('empresa-assets', true),
                ('comercial', true),
                ('programas', true),
                ('xml-files', true),
                ('entregas', false)
            )
            SELECT COALESCE(string_agg(
              r.bucket_id || ' (expected public=' || r.expected_public::text || ', actual public=' || b.public::text || ')',
              ', ' ORDER BY r.bucket_id
            ), '')
            FROM required r
            JOIN storage.buckets b ON b.id = r.bucket_id
            WHERE b.public IS DISTINCT FROM r.expected_public
          ")"
          if [ -n "$bucket_visibility_mismatches" ]; then
            echo "::error::Storage bucket visibility does not match the reviewed House Mix policy: $bucket_visibility_mismatches. Correct the bucket configuration separately; no automatic visibility change is safe."
            exit 1
          fi

          echo "Agenda, forms, delivery-token constraints, all five Storage buckets, and their public/private visibility are verified."

      - name: Require remaining House Mix columns before Bridge writes
        if: ${{ inputs.apply_changes }}
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          missing_or_wrong_columns="$(psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -tA -c "
            WITH required(table_name, column_name, data_type, is_nullable) AS (
              VALUES
                ('infomusic', 'user_id', 'uuid', 'NO'),
                ('infomusic_excecoes', 'artista_url', 'text', 'YES'),
                ('streaming_channels', 'numero_canal', 'text', 'YES'),
                ('profiles', 'event_types_config', 'jsonb', 'YES')
            )
            SELECT COALESCE(string_agg(r.table_name || '.' || r.column_name, ', ' ORDER BY r.table_name, r.column_name), '')
            FROM required r
            LEFT JOIN information_schema.columns c
              ON c.table_schema = 'public'
             AND c.table_name = r.table_name
             AND c.column_name = r.column_name
            WHERE c.column_name IS NULL
               OR c.data_type <> r.data_type
               OR c.is_nullable <> r.is_nullable
          ")"
          if [ -n "$missing_or_wrong_columns" ]; then
            echo "::error::Additional House Mix columns are missing or have the wrong type/nullability: $missing_or_wrong_columns. Apply the reviewed additive migration 20261028223300 before Bridge writes."
            exit 1
          fi
          echo "All four remaining House Mix columns have the expected types and nullability."

      - name: Require House Mix music-history upsert key before Bridge writes
        if: ${{ inputs.apply_changes }}
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          key_present="$(psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -tA -c "
            SELECT EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conrelid = 'public.musicas_tocadas'::regclass
                AND conname = 'musicas_tocadas_user_musica_artista_dia_key'
                AND pg_get_constraintdef(oid) = 'UNIQUE (user_id, musica, artista, dia)'
            )
          ")"
          if [ "$key_present" != "t" ]; then
            echo "::error::House Mix musicas_tocadas upsert key is missing. Apply the reviewed additive migration 20261028205300 before Bridge writes."
            exit 1
          fi
          echo "House Mix musicas_tocadas upsert key is present."

      - name: Require custom vMix button compatibility columns before Bridge writes
        if: ${{ inputs.apply_changes }}
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          missing_or_wrong_columns="$(psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -tA -c "
            WITH required(column_name, data_type, is_nullable) AS (
              VALUES
