name: Deploy NexoHub vMix Bridge backend (manual)

on:
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: "Digite exatamente o Project Ref do backend ativo; nada será publicado se não corresponder ao segredo configurado."
        required: true
        type: string
      apply_changes:
        description: "Marque somente após aprovação explícita para aplicar migrações e publicar as funções Edge."
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: vmix-bridge-backend-manual
  cancel-in-progress: false

jobs:
  deploy-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate target project and credentials
        env:
          INPUT_PROJECT_REF: ${{ inputs.confirm_project_ref }}
          SECRET_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Fail closed: this Bridge workflow is bound to the project configured in supabase/config.toml.
          if ! EXPECTED_PROJECT_REF="$(python3 - <<'PY'
          import tomllib
          with open("supabase/config.toml", "rb") as config_file:
              print(tomllib.load(config_file).get("project_id", ""))
          PY
          )"; then
            echo "::error::Could not read project_id from supabase/config.toml. Nothing was changed."
            exit 1
          fi
          if [ -z "$EXPECTED_PROJECT_REF" ]; then
            echo "::error::supabase/config.toml does not define project_id. Nothing was changed."
            exit 1
          fi
          if [ -z "$SECRET_PROJECT_REF" ]; then
            echo "::error::Configure SUPABASE_PROJECT_REF for the verified active backend."
            exit 1
          fi
          if [ "$SECRET_PROJECT_REF" != "$EXPECTED_PROJECT_REF" ]; then
            echo "::error::SUPABASE_PROJECT_REF does not match the repository's configured backend project. Nothing was changed."
            exit 1
          fi
          if [ "$INPUT_PROJECT_REF" != "$EXPECTED_PROJECT_REF" ]; then
            echo "::error::The manually confirmed Project Ref does not match the repository's configured backend project. Nothing was changed."
            exit 1
          fi
          if ! python3 - "$DATABASE_URL" "$SECRET_PROJECT_REF" <<'PY'
          import sys
          from urllib.parse import unquote, urlparse

          database_url, project_ref = sys.argv[1], sys.argv[2]
          parsed = urlparse(database_url)
          host = (parsed.hostname or "").lower()
          username = unquote(parsed.username or "")
          direct_database_host = host == f"db.{project_ref}.supabase.co"
          project_pooler_host = (
              host.endswith(".pooler.supabase.com")
              and username == f"postgres.{project_ref}"
          )
          if parsed.scheme not in ("postgres", "postgresql") or not (
              direct_database_host or project_pooler_host
          ):
              sys.exit(1)
          PY
          then
            echo "::error::SUPABASE_DB_URL must use the confirmed project's direct database host or its project-specific Supabase pooler. Nothing was changed."
            exit 1
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Configure SUPABASE_ACCESS_TOKEN. Nothing was published."
            exit 1
          fi

      - name: Verify Supabase access token can read the confirmed project (read-only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header "Accept: application/json" \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}")"
          if [ "$status" != "200" ]; then
            echo "::error::Supabase API token cannot read the confirmed project (HTTP ${status}). Nothing was changed."
            exit 1
          fi

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Preflight restored House Mix baseline and Bridge schema (read-only)
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $preflight$
          DECLARE
            missing_house_mix_migrations text;
            missing_core_tables text;
            bridge_table_count integer;
            bridge_migration_applied boolean;
            missing_columns text;
            status_constraint text;
            rls_missing text;
          BEGIN
            IF to_regclass('supabase_migrations.schema_migrations') IS NULL THEN
              RAISE EXCEPTION 'Supabase migration history is missing. Stop and restore/reconcile the House Mix database first.';
            END IF;

            -- Require the six House Mix restoration phases observed on the configured project.
            WITH required(version) AS (
              VALUES
                ('20261028003932'),
                ('20261028025459'),
                ('20261028025525'),
                ('20261028030056'),
                ('20261028030116'),
                ('20261028030144')
            )
            SELECT string_agg(r.version, ', ' ORDER BY r.version)
              INTO missing_house_mix_migrations
            FROM required r
            WHERE NOT EXISTS (
              SELECT 1 FROM supabase_migrations.schema_migrations m
              WHERE m.version = r.version
            );

            IF missing_house_mix_migrations IS NOT NULL THEN
              RAISE EXCEPTION 'House Mix restoration history is incomplete; missing migration versions: %. Nothing was changed.', missing_house_mix_migrations;
            END IF;

            WITH required(table_name) AS (
              VALUES ('profiles'), ('programas'), ('user_settings'), ('empresa_config')
            )
            SELECT string_agg(r.table_name, ', ' ORDER BY r.table_name)
              INTO missing_core_tables
            FROM required r
            WHERE to_regclass('public.' || r.table_name) IS NULL;

            IF missing_core_tables IS NOT NULL THEN
              RAISE EXCEPTION 'House Mix core tables are missing: %. Restore the House Mix schema before Bridge setup.', missing_core_tables;
            END IF;

            SELECT count(*)
              INTO bridge_table_count
            FROM (VALUES
              ('vmix_bridge_pairings'),
              ('vmix_bridge_devices'),
              ('vmix_bridge_jobs')
            ) AS required(table_name)
            WHERE to_regclass('public.' || required.table_name) IS NOT NULL;

            SELECT EXISTS (
              SELECT 1 FROM supabase_migrations.schema_migrations
              WHERE version = '20261022185000'
            ) INTO bridge_migration_applied;

            IF bridge_table_count NOT IN (0, 3) THEN
              RAISE EXCEPTION 'Partial Bridge schema detected (% of 3 tables). Stop and reconcile manually; no automatic repair is safe.', bridge_table_count;
            END IF;

            IF bridge_migration_applied AND bridge_table_count <> 3 THEN
              RAISE EXCEPTION 'Bridge baseline is recorded as applied but one or more Bridge tables are missing. Stop and reconcile manually.';
            END IF;

            -- A fresh backend may have all House Mix restoration phases but no Bridge
            -- tables yet. That is a valid read-only preflight state. The Bridge baseline
            -- is created only by the separately gated apply_changes=true step below.
            IF bridge_table_count = 3 THEN
              WITH required(table_name, column_name) AS (
                VALUES
                  ('vmix_bridge_pairings', 'id'),
                  ('vmix_bridge_pairings', 'user_id'),
                  ('vmix_bridge_pairings', 'code_hash'),
                  ('vmix_bridge_pairings', 'expires_at'),
                  ('vmix_bridge_pairings', 'used_at'),
                  ('vmix_bridge_pairings', 'created_at'),
                  ('vmix_bridge_devices', 'id'),
                  ('vmix_bridge_devices', 'user_id'),
                  ('vmix_bridge_devices', 'device_name'),
                  ('vmix_bridge_devices', 'token_hash'),
                  ('vmix_bridge_devices', 'revoked'),
                  ('vmix_bridge_devices', 'last_seen_at'),
                  ('vmix_bridge_devices', 'created_at'),
                  ('vmix_bridge_jobs', 'id'),
                  ('vmix_bridge_jobs', 'user_id'),
                  ('vmix_bridge_jobs', 'device_id'),
                  ('vmix_bridge_jobs', 'status'),
                  ('vmix_bridge_jobs', 'result_status'),
                  ('vmix_bridge_jobs', 'result_body'),
                  ('vmix_bridge_jobs', 'created_at'),
                  ('vmix_bridge_jobs', 'started_at'),
                  ('vmix_bridge_jobs', 'completed_at'),
                  ('vmix_bridge_jobs', 'path'),
                  ('vmix_bridge_jobs', 'method'),
                  ('vmix_bridge_jobs', 'body')
              )
              SELECT string_agg(r.table_name || '.' || r.column_name, ', ' ORDER BY r.table_name, r.column_name)
                INTO missing_columns
              FROM required r
              LEFT JOIN information_schema.columns c
                ON c.table_schema = 'public'
               AND c.table_name = r.table_name
               AND c.column_name = r.column_name
              WHERE c.column_name IS NULL;

              IF missing_columns IS NOT NULL THEN
                RAISE EXCEPTION 'Bridge schema is incomplete; missing columns: %', missing_columns;
              END IF;

              SELECT pg_get_constraintdef(oid)
                INTO status_constraint
              FROM pg_constraint
              WHERE conrelid = 'public.vmix_bridge_jobs'::regclass
                AND conname = 'vmix_bridge_jobs_status_check';

              IF status_constraint IS NULL
                 OR position('pending' IN status_constraint) = 0
                 OR position('running' IN status_constraint) = 0
                 OR position('succeeded' IN status_constraint) = 0
                 OR position('failed' IN status_constraint) = 0 THEN
                RAISE EXCEPTION 'Bridge job status constraint is not compatible with the pending/running/succeeded/failed contract.';
              END IF;

              SELECT string_agg(c.relname, ', ' ORDER BY c.relname)
                INTO rls_missing
              FROM pg_class c
              JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname = 'public'
                AND c.relname IN ('vmix_bridge_pairings', 'vmix_bridge_devices', 'vmix_bridge_jobs')
                AND c.relkind = 'r'
                AND NOT c.relrowsecurity;

              IF rls_missing IS NOT NULL THEN
                RAISE EXCEPTION 'RLS is not enabled on Bridge tables: %. Stop before deploying Edge Functions.', rls_missing;
              END IF;
            END IF;
          END;
          $preflight$;
          SQL

      - name: Read-only preflight summary
        if: ${{ !inputs.apply_changes }}
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -At <<'SQL'
          SELECT
            'House Mix restoration migrations: verified',
            CASE
              WHEN (
                SELECT count(*)
                FROM (VALUES
                  ('vmix_bridge_pairings'),
                  ('vmix_bridge_devices'),
                  ('vmix_bridge_jobs')
                ) AS required(table_name)
                WHERE to_regclass('public.' || required.table_name) IS NOT NULL
              ) = 3 THEN 'Bridge baseline schema: present'
              ELSE 'Bridge baseline schema: absent; it will be created only if apply_changes=true'
            END,
            CASE
              WHEN EXISTS (
                SELECT 1 FROM information_schema.columns
                WHERE table_schema = 'public'
                  AND table_name = 'vmix_bridge_jobs'
                  AND column_name = 'expires_at'
              ) THEN 'expiry column: present'
              ELSE 'expiry column: missing; migration 20261022200000 will add it if approved'
            END,
            CASE
              WHEN to_regprocedure('public.claim_next_vmix_bridge_job(uuid)') IS NOT NULL
                THEN 'claim RPC: present'
              ELSE 'claim RPC: missing; migration 20261023180000 will create it if approved'
            END,
            CASE
              WHEN EXISTS (
                SELECT 1 FROM supabase_migrations.schema_migrations
                WHERE version = '20261016090000'
              ) THEN 'legacy baseline 20261016090000: already recorded'
              ELSE 'legacy baseline 20261016090000: absent; superseded and reconciled only if changes are approved'
            END;
          SQL
          echo "Read-only preflight completed for the explicitly confirmed project."
          echo "No migration was applied and no Edge Function was deployed."

      - name: Apply initial additive Bridge baseline (explicit approval only)
        if: ${{ inputs.apply_changes }}
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          bridge_table_count="$(psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -tA -c "SELECT count(*) FROM (VALUES ('vmix_bridge_pairings'), ('vmix_bridge_devices'), ('vmix_bridge_jobs')) AS required(table_name) WHERE to_regclass('public.' || required.table_name) IS NOT NULL")"
          if [ "$bridge_table_count" = "0" ]; then
            echo "Bridge tables are absent. Applying only the additive Bridge baseline approved by apply_changes=true."
            psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261022185000_vmix_bridge_backend.sql
          elif [ "$bridge_table_count" = "3" ]; then
            echo "All Bridge tables already exist and passed the read-only schema preflight; no baseline SQL is needed."
          else
            echo "::error::Partial Bridge schema detected after preflight. Nothing was applied."
            exit 1
          fi

          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          DECLARE
            missing_tables text;
            status_constraint text;
          BEGIN
            SELECT string_agg(required.table_name, ', ' ORDER BY required.table_name)
              INTO missing_tables
            FROM (VALUES
              ('vmix_bridge_pairings'),
              ('vmix_bridge_devices'),
              ('vmix_bridge_jobs')
            ) AS required(table_name)
            WHERE to_regclass('public.' || required.table_name) IS NULL;

            IF missing_tables IS NOT NULL THEN
              RAISE EXCEPTION 'Bridge baseline did not create the required tables: %', missing_tables;
            END IF;

            SELECT pg_get_constraintdef(oid)
              INTO status_constraint
            FROM pg_constraint
            WHERE conrelid = 'public.vmix_bridge_jobs'::regclass
              AND conname = 'vmix_bridge_jobs_status_check';

            IF status_constraint IS NULL
               OR position('pending' IN status_constraint) = 0
               OR position('running' IN status_constraint) = 0
               OR position('succeeded' IN status_constraint) = 0
               OR position('failed' IN status_constraint) = 0 THEN
              RAISE EXCEPTION 'Bridge baseline created an incompatible job status constraint.';
            END IF;

            IF EXISTS (
              SELECT 1
              FROM pg_class c
              JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname = 'public'
                AND c.relname IN ('vmix_bridge_pairings', 'vmix_bridge_devices', 'vmix_bridge_jobs')
                AND c.relkind = 'r'
                AND NOT c.relrowsecurity
            ) THEN
              RAISE EXCEPTION 'RLS must be enabled on all Bridge tables before deployment.';
            END IF;
          END;
          $verify$;
          SQL

          applied="$(psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -tA -c "SELECT EXISTS (SELECT 1 FROM supabase_migrations.schema_migrations WHERE version = '20261022185000')")"
          if [ "$applied" != "t" ]; then
            supabase migration repair 20261022185000 --status applied --db-url "$DATABASE_URL"
          fi
          verified="$(psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -tA -c "SELECT EXISTS (SELECT 1 FROM supabase_migrations.schema_migrations WHERE version = '20261022185000')")"
          if [ "$verified" != "t" ]; then
            echo "::error::Bridge baseline migration was not recorded after schema verification."
            exit 1
          fi

      # The current main baseline (20261022185000) supersedes the original PR baseline.
      # Reconcile only the migration ledger so a later Supabase db push cannot replay
      # the older queued/revoked_at schema over the already-validated current schema.
      # This does not execute the legacy SQL and runs only after explicit apply approval.
      - name: Record superseded legacy baseline in migration history (ledger only)
        if: ${{ inputs.apply_changes }}
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          legacy_applied="$(psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -tA -c "SELECT EXISTS (SELECT 1 FROM supabase_migrations.schema_migrations WHERE version = '20261016090000')")"
          if [ "$legacy_applied" != "t" ]; then
            supabase migration repair 20261016090000 --status applied --db-url "$DATABASE_URL"
          fi
          verified="$(psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -tA -c "SELECT EXISTS (SELECT 1 FROM supabase_migrations.schema_migrations WHERE version = '20261016090000')")"
          if [ "$verified" != "t" ]; then
            echo "::error::Could not reconcile superseded legacy Bridge migration history. No schema migration was started."
            exit 1
          fi

      - name: Apply additive expiry-column reconciliation migration
        if: ${{ inputs.apply_changes }}
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261022200000_vmix_bridge_jobs_expiry_column.sql

      - name: Record expiry-column reconciliation migration in Supabase history
        if: ${{ inputs.apply_changes }}
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          applied="$(psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -tA -c "SELECT EXISTS (SELECT 1 FROM supabase_migrations.schema_migrations WHERE version = '20261022200000')")"
          if [ "$applied" != "t" ]; then
            supabase migration repair 20261022200000 --status applied --db-url "$DATABASE_URL"
          fi

      - name: Verify Bridge expiry column after reconciliation
        if: ${{ inputs.apply_changes }}
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema = 'public'
                AND table_name = 'vmix_bridge_jobs'
                AND column_name = 'expires_at'
            ) THEN
              RAISE EXCEPTION 'Bridge jobs expiry column is still missing after reconciliation.';
            END IF;
            IF EXISTS (SELECT 1 FROM public.vmix_bridge_jobs WHERE expires_at IS NULL) THEN
              RAISE EXCEPTION 'Bridge jobs expiry column contains NULL values after reconciliation.';
            END IF;
          END;
          $verify$;
          SQL
      - name: Apply additive expired-job claim-function migration
        if: ${{ inputs.apply_changes }}
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261023180000_expire_vmix_bridge_jobs_in_claim_function.sql

      - name: Record expired-job migration in Supabase history
        if: ${{ inputs.apply_changes }}
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          applied="$(psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -tA -c "SELECT EXISTS (SELECT 1 FROM supabase_migrations.schema_migrations WHERE version = '20261023180000')")"
          if [ "$applied" != "t" ]; then
            supabase migration repair 20261023180000 --status applied --db-url "$DATABASE_URL"
          fi

      - name: Verify expired-job claim function
        if: ${{ inputs.apply_changes }}
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          BEGIN
            IF to_regprocedure('public.claim_next_vmix_bridge_job(uuid)') IS NULL THEN
              RAISE EXCEPTION 'claim_next_vmix_bridge_job(uuid) is missing after migration 20261023180000.';
            END IF;
          END;
          $verify$;
          SQL

      - name: Apply additive pending-status default migration
        if: ${{ inputs.apply_changes }}
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261026214100_vmix_bridge_jobs_pending_default.sql

      - name: Record pending-status migration in Supabase history
        if: ${{ inputs.apply_changes }}
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          applied="$(psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -tA -c "SELECT EXISTS (SELECT 1 FROM supabase_migrations.schema_migrations WHERE version = '20261026214100')")"
          if [ "$applied" != "t" ]; then
            supabase migration repair 20261026214100 --status applied --db-url "$DATABASE_URL"
          fi

      - name: Apply atomic Bridge pairing migration
        if: ${{ inputs.apply_changes }}
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261027123000_vmix_bridge_atomic_pairing.sql

      - name: Record atomic Bridge pairing migration in Supabase history
        if: ${{ inputs.apply_changes }}
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          applied="$(psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -tA -c "SELECT EXISTS (SELECT 1 FROM supabase_migrations.schema_migrations WHERE version = '20261027123000')")"
          if [ "$applied" != "t" ]; then
            supabase migration repair 20261027123000 --status applied --db-url "$DATABASE_URL"
          fi

      - name: Deploy Bridge and vMix Edge Functions
        if: ${{ inputs.apply_changes }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        shell: bash
        run: |
          set -euo pipefail
          for fn in vmix-bridge-pairing vmix-bridge-connect vmix-bridge-poll vmix-bridge-result vmix-bridge-status execute-vmix-commands vmix-proxy; do
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --use-api
          done

      - name: Deployment summary
        if: ${{ inputs.apply_changes }}
        run: |
          echo "Bridge backend workflow completed for the explicitly confirmed project."
          echo "No production deployment is triggered automatically; this workflow runs only by manual dispatch."
