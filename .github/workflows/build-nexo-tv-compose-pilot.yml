name: Build Nexo TV Compose pilot
on:
  workflow_dispatch:
  push:
    branches:
      - feature/nexo-tv-native-apk
    paths:
      - 'firetv/native-tv/**'
      - '.github/workflows/build-nexo-tv-compose-pilot.yml'
  pull_request:
    paths:
      - 'firetv/native-tv/**'
      - '.github/workflows/build-nexo-tv-compose-pilot.yml'
permissions:
  contents: read
jobs:
  native-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Require protected persistent pilot signing key
        env:
          NEXO_TV_KEYSTORE_B64: ${{ secrets.NEXO_TV_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$NEXO_TV_KEYSTORE_B64" ]; then
            echo "::error::Configure repository Actions secret NEXO_TV_KEYSTORE_B64 before building pilot APKs. Random signing and signing-key cache are disabled."
            exit 1
          fi
          umask 077
          key="$RUNNER_TEMP/nexo-tv-permanente.keystore"
          printf %s "$NEXO_TV_KEYSTORE_B64" | base64 -d > "$key"
          expected=$(keytool -exportcert -keystore "$key" -storepass android -alias androiddebugkey | sha256sum | cut -d' ' -f1)
          [[ "$expected" =~ ^[a-f0-9]{64}$ ]]
          echo "NEXO_TV_SIGNING_FILE=$key" >> "$GITHUB_ENV"
          echo "NEXO_TV_CERT_SHA256=$expected" >> "$GITHUB_ENV"
          echo "Expected signing certificate SHA-256: $expected"
      - name: Verify preinstalled Android SDK
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$sdk/platforms/android-35"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
      - name: Check migration contract is present
        run: |
          test -s firetv/native-tv/NEXO_TV_ESPECIFICACAO_NATIVA.md
          test -s firetv/native-tv/AGENTS.md
          test -s firetv/native-tv/ACCEPTANCE.md
          echo '### APK de teste — paridade visual ainda não certificada' >> "$GITHUB_STEP_SUMMARY"
          echo 'A compilação não substitui as capturas comparativas e a validação de TV física exigidas em firetv/native-tv/ACCEPTANCE.md.' >> "$GITHUB_STEP_SUMMARY"
      - name: Reject WebView in native app sources
        run: |
          if grep -R -nE 'android\.webkit|WebView|loadUrl\(' firetv/native-tv/src/main/kotlin; then exit 1; fi
      - name: Compile and test Positiva
        run: gradle -p firetv/native-tv --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" -Pkotlin.compiler.execution.strategy=in-process testPositivaDebugUnitTest assemblePositivaDebug
      - name: Compile and test Interativa
        run: gradle -p firetv/native-tv --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" -Pkotlin.compiler.execution.strategy=in-process testInterativaDebugUnitTest assembleInterativaDebug
      - name: Verify packaged launcher icons and TV artwork
        run: |
          set -euo pipefail
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          test -x "$aapt"
          for station in positiva interativa; do
            apk=$(find "firetv/native-tv/build/outputs/apk/$station/debug" -name '*.apk' | head -1)
            test -s "$apk"
            "$aapt" dump badging "$apk" > /tmp/nexo-$station-badging.txt
            grep -q "versionCode='28'" /tmp/nexo-$station-badging.txt
            grep -E "application-icon-[0-9]+:.*native_tv_tile" /tmp/nexo-$station-badging.txt
            unzip -Z1 "$apk" | grep 'native_tv_banner.png'
            unzip -Z1 "$apk" | grep 'native_tv_launcher.png'
            "$aapt" dump xmltree "$apk" AndroidManifest.xml > /tmp/nexo-$station-manifest.txt
            "$aapt" dump resources "$apk" > /tmp/nexo-$station-resources.txt
            python3 firetv/native-tv/verify_launcher.py "$apk" "$station" /tmp/nexo-$station-manifest.txt /tmp/nexo-$station-resources.txt
          done
      - name: Sign final APKs and verify permanent certificate
        run: |
          set -euo pipefail
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -x "$signer"
          test -s "$NEXO_TV_SIGNING_FILE"
          # Test the parser for both apksigner output formats before signing.
          parse_cert() {
            printf '%s\n' "$1" | awk '/certificate SHA-256 digest:/ && !/public key/ {print $NF}' | tr -d ':\r' | tr '[:upper:]' '[:lower:]' | sort -u
          }
          for prefix in 'Signer #1' 'V3.0 Signer:'; do
            test "$(parse_cert "$prefix certificate SHA-256 digest: $NEXO_TV_CERT_SHA256")" = "$NEXO_TV_CERT_SHA256"
          done
          # Sign the exact files to be distributed, independently of Gradle signing/cache.
          out="$GITHUB_WORKSPACE/firetv/native-tv/build/verified-apks"
          rm -rf "$out"
          mkdir -p "$out"
          report="$out/SIGNATURE-SHA256.txt"
          printf 'Certificate SHA-256: %s\nVersion: 0.1.27-native-preview\nCommit: %s\n' "$NEXO_TV_CERT_SHA256" "$GITHUB_SHA" > "$report"
          for station in positiva interativa; do
            mapfile -t inputs < <(find "firetv/native-tv/build/outputs/apk/$station/debug" -maxdepth 1 -name '*.apk' -type f)
            test "${#inputs[@]}" -eq 1
            src="${inputs[0]}"
            dst="$out/NexoNativeTv-$station-v0.1.27.apk"
            "$signer" sign --ks "$NEXO_TV_SIGNING_FILE" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --min-sdk-version 26 --out "$dst" "$src"
            details=$("$signer" verify --verbose --print-certs --min-sdk-version 26 "$dst")
            printf '%s\n' "$details"
            actual=$(parse_cert "$details")
            echo "$station expected certificate: $NEXO_TV_CERT_SHA256"
            echo "$station actual certificate: $actual"
            printf '%s\n' "$details" | grep -Eq '^Number of signers:[[:space:]]+1[[:space:]]*$'
            [[ "$actual" =~ ^[a-f0-9]{64}$ ]]
            test "$actual" = "$NEXO_TV_CERT_SHA256" || { echo "::error::$station APK certificate mismatch"; exit 1; }
            printf '%s: %s\n' "$station" "$actual" >> "$report"
            (cd "$out" && sha256sum "$(basename "$dst")") >> "$report"
          done
          rm -f "$out"/*.idsig
      - uses: actions/upload-artifact@v4
        with:
          name: nexo-tv-compose-pilot-v0.1.27-verified
          path: |
            firetv/native-tv/build/verified-apks/*.apk
            firetv/native-tv/build/verified-apks/SIGNATURE-SHA256.txt
          if-no-files-found: error
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/nexo-tv-permanente.keystore"
