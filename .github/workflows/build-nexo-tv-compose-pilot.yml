name: Build Nexo TV Compose pilot
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'firetv/native-tv/**'
      - '.github/workflows/build-nexo-tv-compose-pilot.yml'
permissions:
  contents: read
jobs:
  native-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Reject WebView in native app sources
        run: |
          if grep -R -nE 'android\.webkit|WebView|loadUrl\(' firetv/native-tv/src/main/kotlin; then exit 1; fi
      - name: Compile native app and test both flavors
        run: gradle -p firetv/native-tv --no-daemon testPositivaDebugUnitTest testInterativaDebugUnitTest assemblePositivaDebug assembleInterativaDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nexo-tv-compose-pilot
          path: firetv/native-tv/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
