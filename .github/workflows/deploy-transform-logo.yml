name: Deploy sponsor logo transformation

on:
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: "Digite exatamente o Project Ref do backend ativo para confirmar o destino"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-transform-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate configured project and required secrets
        shell: bash
        env:
          INPUT_PROJECT_REF: ${{ inputs.confirm_project_ref }}
          SECRET_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${SECRET_PROJECT_REF}" || { echo "::error::Configure SUPABASE_PROJECT_REF nos GitHub Actions secrets."; exit 1; }
          test -n "${SUPABASE_ACCESS_TOKEN}" || { echo "::error::Configure SUPABASE_ACCESS_TOKEN nos GitHub Actions secrets."; exit 1; }
          test -n "${OPENAI_API_KEY}" || { echo "::error::Configure OPENAI_API_KEY nos GitHub Actions secrets."; exit 1; }

          node <<'NODE'
          const fs = require("node:fs");

          const fail = (message) => {
            console.error(`::error::${message} Nada foi publicado.`);
            process.exit(1);
          };

          let config;
          let envText;
          try {
            config = fs.readFileSync("supabase/config.toml", "utf8");
            envText = fs.readFileSync(".env", "utf8");
          } catch {
            fail("Não foi possível ler supabase/config.toml e .env.");
          }

          const projectRef = config.match(/^\s*project_id\s*=\s*["']([^"']+)["']/m)?.[1];
          if (!projectRef) fail("Project Ref não encontrado em supabase/config.toml.");

          const envValues = {};
          for (const line of envText.split(/\r?\n/)) {
            const match = line.match(/^\s*(SUPABASE_URL|VITE_SUPABASE_URL)\s*=\s*(.*?)\s*$/);
            if (!match) continue;
            envValues[match[1]] = match[2].replace(/^(['"])(.*)\1$/, "$2").trim();
          }

          const configuredUrls = Object.entries(envValues);
          if (configuredUrls.length === 0) fail("SUPABASE_URL e VITE_SUPABASE_URL não foram encontrados no .env.");

          for (const [name, value] of configuredUrls) {
            let url;
            try {
              url = new URL(value);
            } catch {
              fail(`${name} não contém uma URL válida.`);
            }
            if (url.protocol !== "https:" || url.hostname !== `${projectRef}.supabase.co`) {
              fail(`${name} não aponta para o Project Ref de supabase/config.toml.`);
            }
          }

          if (process.env.INPUT_PROJECT_REF?.trim() !== projectRef ||
              process.env.SECRET_PROJECT_REF?.trim() !== projectRef) {
            fail("A confirmação manual e o segredo SUPABASE_PROJECT_REF precisam corresponder ao projeto configurado.");
          }

          console.log("Project Ref confirmado contra supabase/config.toml, .env e segredo do GitHub.");
          NODE

      - name: Configure OpenAI key in the confirmed Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase secrets set OPENAI_API_KEY="$OPENAI_API_KEY" --project-ref "$PROJECT_REF"

      - name: Deploy transform-logo
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy transform-logo --project-ref "$PROJECT_REF" --no-verify-jwt
