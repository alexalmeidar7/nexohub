name: Deploy sponsor logo transformation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-transform-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate required secrets
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Add SUPABASE_ACCESS_TOKEN in GitHub Actions secrets."; exit 1; }
          test -n "$OPENAI_API_KEY" || { echo "::error::Add OPENAI_API_KEY in GitHub Actions secrets."; exit 1; }

      - name: Configure OpenAI key in the target Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: supabase secrets set OPENAI_API_KEY="$OPENAI_API_KEY" --project-ref zzjfzxxvxbspbdkodoix

      - name: Deploy transform-logo
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy transform-logo --project-ref zzjfzxxvxbspbdkodoix --no-verify-jwt
