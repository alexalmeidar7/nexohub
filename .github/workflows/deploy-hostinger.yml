name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Digite exatamente DEPLOY para autorizar a publicação no site"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: housemix-hostinger-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Confirm explicit production deployment
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          CONFIRM_DEPLOY: ${{ inputs.confirm_deploy }}
        run: |
          set -euo pipefail
          test "$CONFIRM_DEPLOY" = "DEPLOY" || {
            echo "::error::Digite exatamente DEPLOY para autorizar a publicação. Nenhum arquivo foi enviado."
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Registrar commit exato do artefato
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          with open("dist/deploy-info.json", "w", encoding="utf-8") as f:
              json.dump({"commit": os.environ["DEPLOY_SHA"]}, f)
          PY

      - name: Resolver e validar destino FTP
        id: ftpdir
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: python3 scripts/ci/hostinger_ftp_target.py resolve

      - name: Deploy Hostinger via FTPS/FTP resiliente
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import posixpath
          import time
          from ftplib import FTP, FTP_TLS, error_perm
          from pathlib import Path

          root = Path('dist').resolve()
          host = os.environ['FTP_SERVER']
          user = os.environ['FTP_USERNAME']
          password = os.environ['FTP_PASSWORD']
          remote_root = os.environ['FTP_SERVER_DIR'].strip('/')

          def connect(tls):
              if tls:
                  ftp = FTP_TLS(timeout=90)
                  ftp.connect(host, 21)
                  ftp.login(user, password)
                  ftp.prot_p()
              else:
                  ftp = FTP(timeout=90)
                  ftp.connect(host, 21)
                  ftp.login(user, password)
              ftp.set_pasv(True)
              return ftp

          def ensure_dir(ftp, path):
              current = ''
              for part in [p for p in path.split('/') if p]:
                  current = posixpath.join(current, part)
                  try:
                      ftp.cwd(current)
                  except error_perm:
                      ftp.mkd(current)
                      ftp.cwd(current)

          def upload(tls):
              ftp = connect(tls)
              try:
                  for local in sorted(root.rglob('*')):
                      if not local.is_file():
                          continue
                      rel = local.relative_to(root).as_posix()
                      remote_path = posixpath.join(remote_root, rel)
                      ensure_dir(ftp, posixpath.dirname(remote_path))
                      print(f'Enviando {rel}')
                      with local.open('rb') as fh:
                          ftp.storbinary(f'STOR {remote_path}', fh, blocksize=1024*64)
                  print(f'Deploy concluído via {"FTPS" if tls else "FTP"}.')
              finally:
                  try: ftp.quit()
                  except Exception: ftp.close()

          last = None
          for tls in (True, False):
              for attempt in (1, 2):
                  try:
                      upload(tls)
                      raise SystemExit(0)
                  except Exception as exc:
                      last = exc
                      print(f'Falha {"FTPS" if tls else "FTP"} tentativa {attempt}/2: {exc}')
                      if attempt == 1: time.sleep(15)
          raise SystemExit(f'Deploy Hostinger falhou após FTPS e FTP: {last}')
          PY

      - name: Confirmar versão publicada
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PUBLIC_URL: https://housemix.nexobrasil.net/deploy-info.json
          PUBLIC_ATTEMPTS: "18"
          PUBLIC_DELAY_SECONDS: "10"
        run: |
          set -euo pipefail
          python3 scripts/ci/hostinger_ftp_target.py public
