name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Digite exatamente DEPLOY para autorizar a publicação no site"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: housemix-hostinger-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Confirm explicit production deployment
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          CONFIRM_DEPLOY: ${{ inputs.confirm_deploy }}
        run: |
          set -euo pipefail
          test "$CONFIRM_DEPLOY" = "DEPLOY" || {
            echo "::error::Digite exatamente DEPLOY para autorizar a publicação. Nenhum arquivo foi enviado."
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Registrar commit exato do artefato
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          with open("dist/deploy-info.json", "w", encoding="utf-8") as f:
              json.dump({"commit": os.environ["DEPLOY_SHA"]}, f)
          PY

      - name: Resolver e validar destino FTP
        id: ftpdir
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: python3 scripts/ci/hostinger_ftp_target.py resolve

      - name: Deploy Hostinger via FTPS/FTP resiliente
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ steps.ftpdir.outputs.server_dir }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y lftp

          run_mirror() {
            local scheme="$1"
            echo "Iniciando mirror via $scheme (porta 21)"

            if [ "$scheme" = "ftps" ]; then
              # Hostinger usa FTPS explícito na porta 21. No lftp, isso é
              # ftp:// + ftp:ssl-force=true; ftps:// pode tentar TLS implícito/990.
              lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" -e "
                set ftp:ssl-force true;
                set ftp:ssl-protect-data true;
                set ssl:verify-certificate no;
                set ftp:passive-mode true;
                set net:timeout 90;
                set net:max-retries 3;
                set net:persist-retries 2;
                set net:reconnect-interval-base 5;
                set net:reconnect-interval-max 30;
                set net:limit-total-rate 4M;
                set net:socket-buffer 32768;
                set cmd:fail-exit yes;
                mirror -c -R --verbose --parallel=1 --only-newer ./dist/ "$FTP_SERVER_DIR";
                bye
              "
            else
              lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" -e "
                set ftp:ssl-force false;
                set ftp:ssl-protect-data false;
                set ftp:passive-mode true;
                set net:timeout 90;
                set net:max-retries 3;
                set net:persist-retries 2;
                set net:reconnect-interval-base 5;
                set net:reconnect-interval-max 30;
                set net:limit-total-rate 4M;
                set net:socket-buffer 32768;
                set cmd:fail-exit yes;
                mirror -c -R --verbose --parallel=1 --only-newer ./dist/ "$FTP_SERVER_DIR";
                bye
              "
            fi
          }

          # FTPS: duas tentativas, retomando o mirror interrompido.
          for attempt in 1 2; do
            echo "FTPS tentativa $attempt/2"
            if run_mirror "ftps"; then
              echo "Deploy concluído via FTPS."
              exit 0
            fi
            if [ "$attempt" -lt 2 ]; then
              echo "FTPS falhou; aguardando 15s para nova conexão."
              sleep 15
            fi
          done

          # Fallback controlado para FTP simples.
          # A Hostinger documenta FTP na porta 21 como método suportado.
          echo "::warning::FTPS não estabilizou. Tentando FTP simples para concluir a publicação."
          if run_mirror "ftp"; then
            echo "Deploy concluído via FTP."
            exit 0
          fi

          echo "::error::FTPS e FTP falharam. O artefato não foi considerado publicado."
          exit 1

      - name: Confirmar versão publicada
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PUBLIC_URL: https://housemix.nexobrasil.net/deploy-info.json
          PUBLIC_ATTEMPTS: "18"
          PUBLIC_DELAY_SECONDS: "10"
        run: |
          set -euo pipefail
          python3 scripts/ci/hostinger_ftp_target.py public
