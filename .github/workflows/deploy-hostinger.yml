name: Deploy to Hostinger

on:
  # Every commit merged/pushed to main is published automatically.
  # Do not restrict this to a marker file: that was preventing normal PR
  # merges from reaching the production site.
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Digite exatamente DEPLOY para autorizar a publicação no site"
        required: true
        type: string

permissions:
  contents: read

# Serialize FTP deployments so two merges cannot overwrite each other.
# A newer pending main commit is the one that should reach production.
concurrency:
  group: housemix-hostinger-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Confirm explicit production deployment
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          CONFIRM_DEPLOY: ${{ inputs.confirm_deploy }}
        run: |
          set -euo pipefail
          test "$CONFIRM_DEPLOY" = "DEPLOY" || {
            echo "::error::Digite exatamente DEPLOY para autorizar a publicação. Nenhum arquivo foi enviado."
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Registrar commit exato do artefato
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          with open("dist/deploy-info.json", "w", encoding="utf-8") as f:
              json.dump({"commit": os.environ["DEPLOY_SHA"]}, f)
          PY

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install ImageMagick for application icon
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Build NexoHub Bridge (Windows x64)
        run: |
          mkdir -p dist/downloads/nexohub-bridge
          convert src/assets/logo-nexo.png -background none -gravity center -resize 256x256 -extent 256x256 -define icon:auto-resize=256,128,64,48,32,16 tools/NexoHubBridge/bridge.ico
          dotnet publish tools/NexoHubBridge/NexoHubBridge.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:ApplicationIcon=bridge.ico -o dist/downloads/nexohub-bridge
          export BRIDGE_VERSION="$(dotnet msbuild tools/NexoHubBridge/NexoHubBridge.csproj -getProperty:Version | tail -n 1 | tr -d '\r')"
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          path = "dist/downloads/nexohub-bridge/NexoHubBridge.exe"
          if not os.path.isfile(path):
              raise SystemExit("NexoHubBridge.exe was not generated")
          manifest = {
              "version": os.environ["BRIDGE_VERSION"],
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "sizeBytes": os.path.getsize(path),
              "downloadUrl": "https://housemix.nexobrasil.net/downloads/nexohub-bridge/NexoHubBridge.exe"
          }
          with open("dist/downloads/nexohub-bridge/latest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False)
          PY

      # Resolve o destino uma única vez. FTP_SERVER_DIR é sempre relativo à pasta
      # inicial do usuário FTP; o passo falha antes do upload se o destino não
      # existir ou repetir uma pasta (ex.: public_html/public_html).
      - name: Resolver e validar destino FTP
        id: ftpdir
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: python3 scripts/ci/hostinger_ftp_target.py resolve

      - name: Deploy via FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ steps.ftpdir.outputs.server_dir }}
        run: |
          python3 - <<'PY'
          import os
          import posixpath
          import ssl
          from ftplib import FTP_TLS, error_perm

          root = os.environ['FTP_SERVER_DIR'].strip().strip('/')
          base = os.path.abspath('dist')
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE
          ftp = FTP_TLS(context=ctx, timeout=120)
          ftp.connect(os.environ['FTP_SERVER'], 21, timeout=120)
          ftp.auth()
          ftp.prot_p()
          ftp.login(os.environ['FTP_USERNAME'], os.environ['FTP_PASSWORD'])

          def ensure_dir(path):
              if not path:
                  return
              original = ftp.pwd()
              try:
                  ftp.cwd(path)
                  return
              except error_perm:
                  pass
              ftp.cwd(original)
              for part in [p for p in path.split('/') if p]:
                  try:
                      ftp.cwd(part)
                  except error_perm:
                      ftp.mkd(part)
                      ftp.cwd(part)

          try:
              ensure_dir(root)
              uploaded = 0
              for current, _, files in os.walk(base):
                  rel = os.path.relpath(current, base).replace(os.sep, '/')
                  remote_dir = root
                  if rel != '.':
                      remote_dir = posixpath.join(root, rel)
                  ensure_dir(remote_dir)
                  ftp.cwd(remote_dir)
                  for name in files:
                      local = os.path.join(current, name)
                      with open(local, 'rb') as fh:
                          ftp.storbinary(f'STOR {name}', fh, blocksize=1024*1024)
                      uploaded += 1
                      print(f'UPLOAD {posixpath.join(remote_dir, name)}')
              print(f'FTPS upload concluido: {uploaded} arquivos')
          finally:
              try:
                  ftp.quit()
              except Exception:
                  ftp.close()
          PY
      - name: Confirmar versão publicada
        env:
          EXPECTED_SHA: ${{ github.sha }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          EFFECTIVE_DIR: ${{ steps.ftpdir.outputs.effective_dir }}
        run: |
          set -euo pipefail
          # 1. Mesmo diretório do upload, lido pelo FTPS.
          python3 scripts/ci/hostinger_ftp_target.py verify
          # 2. O domínio público precisa servir esse mesmo arquivo.
          python3 scripts/ci/hostinger_ftp_target.py public
