name: Deploy to Hostinger

on:
  # Every commit merged/pushed to main is published automatically.
  # Do not restrict this to a marker file: that was preventing normal PR
  # merges from reaching the production site.
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Digite exatamente DEPLOY para autorizar a publicação no site"
        required: true
        type: string

permissions:
  contents: read

# Serialize FTP deployments so two merges cannot overwrite each other.
# A newer pending main commit is the one that should reach production.
concurrency:
  group: housemix-hostinger-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Confirm explicit production deployment
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          CONFIRM_DEPLOY: ${{ inputs.confirm_deploy }}
        run: |
          set -euo pipefail
          test "$CONFIRM_DEPLOY" = "DEPLOY" || {
            echo "::error::Digite exatamente DEPLOY para autorizar a publicação. Nenhum arquivo foi enviado."
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Registrar commit exato do artefato
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          with open("dist/deploy-info.json", "w", encoding="utf-8") as f:
              json.dump({"commit": os.environ["DEPLOY_SHA"]}, f)
          PY

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install ImageMagick for application icon
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Build NexoHub Bridge (Windows x64)
        run: |
          mkdir -p dist/downloads/nexohub-bridge
          convert src/assets/logo-nexo.png -background none -gravity center -resize 256x256 -extent 256x256 -define icon:auto-resize=256,128,64,48,32,16 tools/NexoHubBridge/bridge.ico
          dotnet publish tools/NexoHubBridge/NexoHubBridge.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:ApplicationIcon=bridge.ico -o dist/downloads/nexohub-bridge
          export BRIDGE_VERSION="$(dotnet msbuild tools/NexoHubBridge/NexoHubBridge.csproj -getProperty:Version | tail -n 1 | tr -d '\r')"
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          path = "dist/downloads/nexohub-bridge/NexoHubBridge.exe"
          if not os.path.isfile(path):
              raise SystemExit("NexoHubBridge.exe was not generated")
          manifest = {
              "version": os.environ["BRIDGE_VERSION"],
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "sizeBytes": os.path.getsize(path),
              "downloadUrl": "https://housemix.nexobrasil.net/downloads/nexohub-bridge/NexoHubBridge.exe"
          }
          with open("dist/downloads/nexohub-bridge/latest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False)
          PY

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./dist/
          protocol: ftps
          port: 21
          timeout: 120000
          # Use a dedicated sync-state so the old Hostinger state cannot
          # suppress deploy-info.json or other files after the server root
          # was corrected. The first run with this state performs a fresh
          # synchronization against the configured FTP server-dir.
          state-name: .ftp-deploy-sync-state-housemix.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
      - name: Confirmar versão publicada
        env:
          EXPECTED_SHA: ${{ github.sha }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          FTP_PATH="${FTP_SERVER_DIR#./}"
          case "$FTP_PATH" in
            */) ;;
            *) FTP_PATH="$FTP_PATH/" ;;
          esac

          FTP_URL="ftp://$FTP_SERVER/$FTP_PATH/deploy-info.json"
          echo "Validando deploy-info.json diretamente no diretório FTP configurado..."

          # A validação pública por HTTPS foi removida desta etapa.
          # O domínio usa a SPA/rewrite e pode apresentar certificado/redirect
          # diferente do endpoint FTP, portanto não é uma prova confiável do
          # conteúdo que acabou de ser enviado.
          #
          # O upload já foi concluído pelo FTP-Deploy-Action. Aqui validamos
          # diretamente o mesmo servidor e diretório de destino, por FTPS.
          # O Hostinger apresenta certificado incompatível quando FTP_SERVER
          # aponta para IP; --insecure mantém FTPS/TLS ativo e desativa apenas
          # a checagem de correspondência do certificado com o IP.
          curl --fail --silent --show-error --insecure \
            --ftp-ssl --ssl-reqd \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            --output /tmp/deploy-info-ftp.json \
            "$FTP_URL"

          FTP_SHA="$(python3 - <<'PY'
          import json
          try:
              with open("/tmp/deploy-info-ftp.json", encoding="utf-8") as f:
                  data = json.load(f)
              value = data.get("commit", "")
              print(value if isinstance(value, str) else "")
          except (OSError, UnicodeDecodeError, json.JSONDecodeError, AttributeError):
              print("")
          PY
          )"

          if [ "$FTP_SHA" = "$EXPECTED_SHA" ]; then
            echo "Deploy confirmado no Hostinger via FTPS no commit $FTP_SHA."
            exit 0
          fi

          echo "::error::O arquivo publicado no Hostinger não contém o SHA esperado."
          echo "SHA no FTPS='$FTP_SHA' esperado='$EXPECTED_SHA'"
          exit 1
