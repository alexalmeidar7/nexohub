name: Deploy to Hostinger

on:
  # Every commit merged/pushed to main is published automatically.
  # Do not restrict this to a marker file: that was preventing normal PR
  # merges from reaching the production site.
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Digite exatamente DEPLOY para autorizar a publicação no site"
        required: true
        type: string

permissions:
  contents: read

# Serialize FTP deployments so two merges cannot overwrite each other.
# A newer pending main commit is the one that should reach production.
concurrency:
  group: housemix-hostinger-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Confirm explicit production deployment
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          CONFIRM_DEPLOY: ${{ inputs.confirm_deploy }}
        run: |
          set -euo pipefail
          test "$CONFIRM_DEPLOY" = "DEPLOY" || {
            echo "::error::Digite exatamente DEPLOY para autorizar a publicação. Nenhum arquivo foi enviado."
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Registrar commit exato do artefato
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          with open("dist/deploy-info.json", "w", encoding="utf-8") as f:
              json.dump({"commit": os.environ["DEPLOY_SHA"]}, f)
          PY

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install ImageMagick for application icon
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Build NexoHub Bridge (Windows x64)
        run: |
          mkdir -p dist/downloads/nexohub-bridge
          convert src/assets/logo-nexo.png -background none -gravity center -resize 256x256 -extent 256x256 -define icon:auto-resize=256,128,64,48,32,16 tools/NexoHubBridge/bridge.ico
          dotnet publish tools/NexoHubBridge/NexoHubBridge.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:ApplicationIcon=bridge.ico -o dist/downloads/nexohub-bridge
          export BRIDGE_VERSION="$(dotnet msbuild tools/NexoHubBridge/NexoHubBridge.csproj -getProperty:Version | tail -n 1 | tr -d '\r')"
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          path = "dist/downloads/nexohub-bridge/NexoHubBridge.exe"
          if not os.path.isfile(path):
              raise SystemExit("NexoHubBridge.exe was not generated")
          manifest = {
              "version": os.environ["BRIDGE_VERSION"],
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "sizeBytes": os.path.getsize(path),
              "downloadUrl": "https://housemix.nexobrasil.net/downloads/nexohub-bridge/NexoHubBridge.exe"
          }
          with open("dist/downloads/nexohub-bridge/latest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False)
          PY

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./dist/
          protocol: ftps
          port: 21
          timeout: 120000
          # Use a dedicated sync-state so the old Hostinger state cannot
          # suppress deploy-info.json or other files after the server root
          # was corrected. The first run with this state performs a fresh
          # synchronization against the configured FTP server-dir.
          state-name: .ftp-deploy-sync-state-housemix.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
      - name: Confirmar versão publicada
        env:
          EXPECTED_SHA: ${{ github.sha }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Validando deploy-info.json diretamente no mesmo servidor FTPS do upload..."

          python3 - <<'PY'
          import json
          import os
          import ssl
          import sys
          from ftplib import FTP_TLS

          expected = os.environ["EXPECTED_SHA"]
          server = os.environ["FTP_SERVER"]
          username = os.environ["FTP_USERNAME"]
          password = os.environ["FTP_PASSWORD"]
          server_dir = os.environ["FTP_SERVER_DIR"].strip()

          # FTP-Deploy-Action usa o mesmo servidor, porta 21 e protocolo FTPS.
          # O Hostinger pode apresentar um certificado emitido para hostname
          # enquanto FTP_SERVER contém um IP; nesse caso mantemos TLS ativo,
          # mas desativamos somente a validação do nome do certificado.
          context = ssl.create_default_context()
          context.check_hostname = False
          context.verify_mode = ssl.CERT_NONE

          remote_path = server_dir
          while remote_path.startswith("./"):
              remote_path = remote_path[2:]
          remote_path = remote_path.rstrip("/")
          remote_path = f"{remote_path}/deploy-info.json" if remote_path else "deploy-info.json"

          local_path = "/tmp/deploy-info-ftp.json"
          ftp = FTP_TLS(context=context, timeout=60)

          try:
              ftp.connect(server, 21, timeout=60)
              ftp.auth()
              ftp.prot_p()
              ftp.login(username, password)

              with open(local_path, "wb") as output:
                  ftp.retrbinary(f"RETR {remote_path}", output.write, blocksize=64 * 1024)

          except Exception as exc:
              print(f"::error::Falha ao ler {remote_path} via FTPS: {exc}")
              sys.exit(1)
          finally:
              try:
                  ftp.quit()
              except Exception:
                  try:
                      ftp.close()
                  except Exception:
                      pass

          try:
              with open(local_path, encoding="utf-8") as f:
                  data = json.load(f)
              actual = data.get("commit", "")
          except (OSError, UnicodeDecodeError, json.JSONDecodeError, AttributeError) as exc:
              print(f"::error::deploy-info.json publicado é inválido ou não pôde ser lido: {exc}")
              sys.exit(1)

          if actual != expected:
              print("::error::O arquivo publicado no Hostinger não contém o SHA esperado.")
              print(f"SHA no FTPS='{actual}' esperado='{expected}'")
              sys.exit(1)

          print(f"Deploy confirmado no Hostinger via FTPS no commit {actual}.")
          PY
