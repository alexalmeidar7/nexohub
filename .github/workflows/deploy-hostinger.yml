name: Deploy to Hostinger

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Digite exatamente DEPLOY para autorizar a publicação no site."
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Confirm explicit production deployment
        shell: bash
        env:
          CONFIRM_DEPLOY: ${{ inputs.confirm_deploy }}
        run: |
          set -euo pipefail
          test "$CONFIRM_DEPLOY" = "DEPLOY" || {
            echo "::error::Digite exatamente DEPLOY para autorizar a publicação. Nenhum arquivo foi enviado."
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (retry transient registry limits)
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4; do
            if bun install; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              sleep $((attempt * 15))
            fi
          done
          echo "::error::bun install failed after 4 attempts; check registry availability or rate limits."
          exit 1

      - name: Build
        run: bun run build

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build versioned NexoHub Bridge and checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(dotnet msbuild tools/NexoHubBridge/NexoHubBridge.csproj -getProperty:Version -nologo | tr -d '\r\n')"
          test -n "$VERSION"
          mkdir -p dist/downloads/nexohub-bridge
          dotnet publish tools/NexoHubBridge/NexoHubBridge.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist/downloads/nexohub-bridge
          SHA256="$(sha256sum dist/downloads/nexohub-bridge/NexoHubBridge.exe | cut -d ' ' -f1)"
          [[ "$SHA256" =~ ^[a-fA-F0-9]{64}$ ]]
          export BRIDGE_VERSION="$VERSION"
          export BRIDGE_SHA256="$SHA256"
          export BRIDGE_DOWNLOAD_URL="https://housemix.nexobrasil.net/downloads/nexohub-bridge/NexoHubBridge.exe"
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          path = "dist/downloads/nexohub-bridge/NexoHubBridge.exe"
          if not os.path.isfile(path):
              raise SystemExit("NexoHubBridge.exe was not generated")

          manifest = {
              "version": os.environ["BRIDGE_VERSION"],
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "sizeBytes": os.path.getsize(path),
              "downloadUrl": os.environ["BRIDGE_DOWNLOAD_URL"],
              "sha256": os.environ["BRIDGE_SHA256"],
          }
          with open("dist/downloads/nexohub-bridge/latest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False)
          PY
          python3 -m json.tool dist/downloads/nexohub-bridge/latest.json > /dev/null

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./dist/
          protocol: ftps
          port: 21
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
