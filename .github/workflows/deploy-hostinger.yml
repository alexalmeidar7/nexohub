name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (retry transient registry limits)
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4; do
            if bun install; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              sleep $((attempt * 15))
            fi
          done
          echo "::error::bun install failed after 4 attempts; check registry availability or rate limits."
          exit 1

      - name: Build
        run: bun run build

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build versioned NexoHub Bridge and checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(dotnet msbuild tools/NexoHubBridge/NexoHubBridge.csproj -getProperty:Version -nologo | tr -d '\r\n')"
          test -n "$VERSION"
          mkdir -p dist/downloads/nexohub-bridge
          dotnet publish tools/NexoHubBridge/NexoHubBridge.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist/downloads/nexohub-bridge
          SHA256="$(sha256sum dist/downloads/nexohub-bridge/NexoHubBridge.exe | cut -d ' ' -f1)"
          DOWNLOAD_URL="https://housemix.nexobrasil.net/downloads/nexohub-bridge/NexoHubBridge.exe"
          printf '{"version":"%s","downloadUrl":"%s","sha256":"%s"}\n' "$VERSION" "$DOWNLOAD_URL" "$SHA256" > dist/downloads/nexohub-bridge/latest.json
          python -m json.tool dist/downloads/nexohub-bridge/latest.json > /dev/null

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./dist/
          protocol: ftps
          port: 21
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
