name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Digite exatamente DEPLOY para autorizar a publicação no site"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: housemix-hostinger-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Confirm explicit production deployment
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          CONFIRM_DEPLOY: ${{ inputs.confirm_deploy }}
        run: |
          set -euo pipefail
          test "$CONFIRM_DEPLOY" = "DEPLOY" || {
            echo "::error::Digite exatamente DEPLOY para autorizar a publicação. Nenhum arquivo foi enviado."
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Registrar commit exato do artefato
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          with open("dist/deploy-info.json", "w", encoding="utf-8") as f:
              json.dump({"commit": os.environ["DEPLOY_SHA"]}, f)
          PY

      - name: Resolver e validar destino FTP
        id: ftpdir
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: python3 scripts/ci/hostinger_ftp_target.py resolve

      - name: Deploy via FTPS com lftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ steps.ftpdir.outputs.server_dir }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y lftp

          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftps://$FTP_SERVER" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set ftp:passive-mode true
          set net:timeout 90
          set net:max-retries 3
          set net:persist-retries 2
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 30
          set cmd:fail-exit yes

          # Hostinger pode resetar uma conexão durante um mirror grande.
          # Não deixamos o job preso em retry infinito: no máximo 2 mirrors,
          # e cada nova tentativa continua do ponto já enviado.
          attempt=1
          max_attempts=2
          while true; do
            echo "FTPS mirror tentativa $attempt/$max_attempts"
            if lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftps://$FTP_SERVER" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set ftp:passive-mode true
          set net:timeout 90
          set net:max-retries 3
          set net:persist-retries 2
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 30
          set cmd:fail-exit yes
          mirror -c -R --verbose --parallel=1 --only-newer --continue ./dist/ "$FTP_SERVER_DIR"
          bye
          EOF
            then
              break
            fi

            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::FTPS mirror falhou após $max_attempts tentativas."
              exit 1
            fi

            attempt=$((attempt + 1))
            echo "FTPS instável; aguardando 15s e continuando o mirror."
            sleep 15
          done
          EOF

          echo "Deploy FTPS concluído."

      - name: Confirmar versão publicada
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PUBLIC_URL: https://housemix.nexobrasil.net/deploy-info.json
          PUBLIC_ATTEMPTS: "18"
          PUBLIC_DELAY_SECONDS: "10"
        run: |
          set -euo pipefail
          python3 scripts/ci/hostinger_ftp_target.py public
