name: Deploy to Hostinger

on:
  # Every commit merged/pushed to main is published automatically.
  # Do not restrict this to a marker file: that was preventing normal PR
  # merges from reaching the production site.
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Digite exatamente DEPLOY para autorizar a publicação no site"
        required: true
        type: string

permissions:
  contents: read

# Serialize FTP deployments so two merges cannot overwrite each other.
# A newer pending main commit is the one that should reach production.
concurrency:
  group: housemix-hostinger-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Confirm explicit production deployment
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          CONFIRM_DEPLOY: ${{ inputs.confirm_deploy }}
        run: |
          set -euo pipefail
          test "$CONFIRM_DEPLOY" = "DEPLOY" || {
            echo "::error::Digite exatamente DEPLOY para autorizar a publicação. Nenhum arquivo foi enviado."
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Registrar commit exato do artefato
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          with open("dist/deploy-info.json", "w", encoding="utf-8") as f:
              json.dump({"commit": os.environ["DEPLOY_SHA"]}, f)
          PY

      # Resolve o destino uma única vez. FTP_SERVER_DIR é relativo à pasta inicial do usuário FTP.
      # O deploy usa lftp porque o FTP-Deploy-Action está sofrendo ECONNRESET no data socket
      # ao sincronizar o grande volume de arquivos do House Mix.
      # Resolve o destino uma única vez. FTP_SERVER_DIR é sempre relativo à pasta
      # inicial do usuário FTP; o passo falha antes do upload se o destino não
      # existir ou repetir uma pasta (ex.: public_html/public_html).
      - name: Resolver e validar destino FTP
        id: ftpdir
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: python3 scripts/ci/hostinger_ftp_target.py resolve

      - name: Deploy via SFTP (primary) com fallback FTPS
        env:
          FTP_SERVER: \${{ secrets.FTP_SERVER }}
          FTP_USERNAME: \${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: \${{ secrets.FTP_PASSWORD }}
          SFTP_SERVER_DIR: \${{ secrets.FTP_SERVER_DIR }}
          FTPS_SERVER_DIR: \${{ steps.ftpdir.outputs.server_dir }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y lftp

          # Hostinger SFTP usa SSH na porta 65002. Para o usuário SFTP,
          # o caminho do domínio é relativo à raiz SSH; usamos o FTP_SERVER_DIR
          # configurado (domains/.../public_html).
          if lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "sftp://$FTP_SERVER:65002" <<EOF
          set sftp:auto-confirm yes
          set net:timeout 60
          set net:max-retries 5
          set net:reconnect-interval-base 5
          mirror -c -R --verbose --parallel=1 ./dist/ "$SFTP_SERVER_DIR"
          bye
          EOF
          then
            echo "Deploy concluído via SFTP."
          else
            echo "::warning::SFTP indisponível; usando FTPS como fallback."
            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftps://$FTP_SERVER" <<EOF
            set ftp:ssl-force true
            set ftp:ssl-protect-data true
            set ssl:verify-certificate no
            set ftp:passive-mode true
            set net:timeout 60
            set net:max-retries 5
            set net:reconnect-interval-base 5
            mirror -c -R --verbose --parallel=1 ./dist/ "$FTPS_SERVER_DIR"
            bye
            EOF
          fi

      - name: Confirmar versão publicada
        env:
          EXPECTED_SHA: \${{ github.sha }}
          PUBLIC_URL: https://housemix.nexobrasil.net/deploy-info.json
          PUBLIC_ATTEMPTS: "18"
          PUBLIC_DELAY_SECONDS: "10"
        run: |
          set -euo pipefail
          # Confirmação definitiva: o domínio público precisa servir o SHA deste build.
          python3 scripts/ci/hostinger_ftp_target.py public
