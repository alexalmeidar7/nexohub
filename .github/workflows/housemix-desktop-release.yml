name: House Mix Desktop Release

on:
  workflow_run:
    workflows: ["Verificar build"]
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: housemix-desktop-release
  cancel-in-progress: false

jobs:
  build-windows:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Choose next release version
        id: version
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const parse = (value) => String(value).replace(/^v/, '').split('.').map(Number);
            const compare = (left, right) => {
              for (let index = 0; index < 3; index += 1) {
                if (left[index] !== right[index]) return left[index] > right[index] ? 1 : -1;
              }
              return 0;
            };
            let latestParts = [0, 0, 0];
            try {
              const { data } = await github.rest.repos.getLatestRelease({ ...context.repo });
              latestParts = parse(data.tag_name);
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const currentParts = parse(pkg.version);
            const base = compare(currentParts, latestParts) >= 0 ? currentParts : latestParts;
            const [major = 1, minor = 0, patch = 0] = base;
            core.setOutput('next', `${major}.${minor}.${patch + 1}`);

      - name: Set release version
        shell: pwsh
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next }}
        run: npm version $env:NEXT_VERSION --no-git-tag-version

      - name: Install dependencies
        run: npm install

      - name: Install local API production dependencies
        run: npm install --prefix infra/offline-first/api --omit=dev --no-audit --no-fund

      - name: Bundle portable Node runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "desktop/runtime/node" | Out-Null
          Copy-Item (Get-Command node).Source "desktop/runtime/node/node.exe" -Force

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish offline-first runtime
        shell: pwsh
        run: |
          dotnet publish infra/offline-first/desktop-client/HouseMix.OfflineFirst.Host/HouseMix.OfflineFirst.Host.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -o desktop/runtime/local-api-host
          dotnet publish infra/offline-first/desktop-client/HouseMix.OfflineFirst.Provisioner/HouseMix.OfflineFirst.Provisioner.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -o desktop/runtime/provisioner
          New-Item -ItemType Directory -Force -Path "desktop/runtime/provisioner/schema" | Out-Null
          Copy-Item "infra/offline-first/schema/*.sql" "desktop/runtime/provisioner/schema/" -Force

      - name: Bundle local API runtime
        run: npm run desktop:bundle-local-api

      - name: Build Desktop frontend
        run: npm run desktop:build

      - name: Build and publish House Mix Desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm exec electron-builder -- --win nsis --publish always
