name: Deploy background audience collector

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-background-audience-collector
  cancel-in-progress: false

jobs:
  deploy-collector:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate deployment secrets
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Add SUPABASE_ACCESS_TOKEN in GitHub Actions secrets."; exit 1; }
          test -n "$SUPABASE_DB_URL" || { echo "::error::Add SUPABASE_DB_URL in GitHub Actions secrets."; exit 1; }

      - name: Deploy collector Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy collect-audience --project-ref zzjfzxxvxbspbdkodoix --no-verify-jwt

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Apply background schedule migration
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/202610150001_collect_audience_background.sql

      - name: Verify collector schedule
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "select jobname, schedule, active from cron.job where jobname = 'collect-audience-every-five-minutes';"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "select (count(*) = 1) as collector_secret_configured from public.audience_collector_settings where id = true;"
