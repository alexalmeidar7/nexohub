name: Deploy and validate XML production stack

on:
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: "Digite exatamente qazvgmgdidjhbvcuinpy para autorizar o deploy"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: xml-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply pending XML migrations and deploy feeds
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production target and credentials
        env:
          INPUT_PROJECT_REF: ${{ inputs.confirm_project_ref }}
          SECRET_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          EXPECTED="qazvgmgdidjhbvcuinpy"
          test "$INPUT_PROJECT_REF" = "$EXPECTED" || { echo "::error::Confirmação inválida. Nenhuma alteração executada."; exit 1; }
          test "$SECRET_PROJECT_REF" = "$EXPECTED" || { echo "::error::SUPABASE_PROJECT_REF ausente ou diferente do projeto de produção."; exit 1; }
          test -n "$ACCESS_TOKEN" || { echo "::error::Configure SUPABASE_ACCESS_TOKEN nos secrets."; exit 1; }
          test -n "$DB_URL" || { echo "::error::Configure SUPABASE_DB_URL com a URI do Session Pooler IPv4."; exit 1; }
          case "$DB_URL" in
            postgresql://*|postgres://*) ;;
            *) echo "::error::SUPABASE_DB_URL precisa ser uma URI PostgreSQL."; exit 1 ;;
          esac

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply only the two pending audited migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

          apply_migration() {
            local version="$1"
            local name="$2"
            local file="$3"

            local already_applied
            already_applied="$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atc \
              "select 1 from supabase_migrations.schema_migrations where version = '$version' limit 1")"

            if [ "$already_applied" = "1" ]; then
              echo "Migration $version already recorded; skipping."
              return
            fi

            echo "Applying $file"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$file"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c \
              "insert into supabase_migrations.schema_migrations(version, name) values ('$version', '$name') on conflict (version) do nothing"
          }

          apply_migration "20261028180000" "fix_agenda_eventos_schema" "supabase/migrations/20261028180000_fix_agenda_eventos_schema.sql"
          apply_migration "20261028193000" "reconcile_audited_forms_schema_and_storage" "supabase/migrations/20261028193000_reconcile_audited_forms_schema_and_storage.sql"

      - name: Deploy XML Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          for function_name in serve-xml-geral serve-xml-tempo serve-xml-roteiro-estudio serve-xml-cenarios-estudio serve-xml-broadcast serve-xml-vmix-live serve-xml-logos serve-xml-enquete serve-xml-batalha serve-xml-quiz update-weather-xml; do
            supabase functions deploy "$function_name" --project-ref qazvgmgdidjhbvcuinpy --use-api
          done
