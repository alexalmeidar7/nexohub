name: Deploy and validate XML production stack

on:
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: "Digite exatamente qazvgmgdidjhbvcuinpy para autorizar o deploy"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: xml-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply XML migrations and deploy feeds
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production target and credentials
        env:
          INPUT_PROJECT_REF: ${{ inputs.confirm_project_ref }}
          SECRET_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          EXPECTED="qazvgmgdidjhbvcuinpy"
          test "$INPUT_PROJECT_REF" = "$EXPECTED" || { echo "::error::Confirmação inválida. Nenhuma alteração executada."; exit 1; }
          test "$SECRET_PROJECT_REF" = "$EXPECTED" || { echo "::error::SUPABASE_PROJECT_REF ausente ou diferente do projeto de produção."; exit 1; }
          test -n "$ACCESS_TOKEN" || { echo "::error::Configure SUPABASE_ACCESS_TOKEN nos secrets."; exit 1; }
          test -n "$DB_PASSWORD" || { echo "::error::Configure SUPABASE_DB_PASSWORD nos secrets."; exit 1; }

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply pending database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase db push --project-ref qazvgmgdidjhbvcuinpy --password "$DB_PASSWORD"

      - name: Deploy XML Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          for function_name in serve-xml-geral serve-xml-tempo serve-xml-roteiro-estudio serve-xml-cenarios-estudio serve-xml-broadcast serve-xml-vmix-live serve-xml-logos serve-xml-enquete serve-xml-batalha serve-xml-quiz update-weather-xml; do
            supabase functions deploy "$function_name" --project-ref qazvgmgdidjhbvcuinpy --use-api
          done
