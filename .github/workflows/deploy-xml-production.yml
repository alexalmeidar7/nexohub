name: Deploy and validate XML production stack

on:
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: "Digite exatamente qazvgmgdidjhbvcuinpy para autorizar o deploy"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: xml-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply pending XML migrations and deploy feeds
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production target and credentials
        env:
          INPUT_PROJECT_REF: ${{ inputs.confirm_project_ref }}
          SECRET_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          EXPECTED="qazvgmgdidjhbvcuinpy"
          test "$INPUT_PROJECT_REF" = "$EXPECTED" || { echo "::error::Confirmação inválida. Nenhuma alteração executada."; exit 1; }
          test "$SECRET_PROJECT_REF" = "$EXPECTED" || { echo "::error::SUPABASE_PROJECT_REF ausente ou diferente do projeto de produção."; exit 1; }
          test -n "$ACCESS_TOKEN" || { echo "::error::Configure SUPABASE_ACCESS_TOKEN nos secrets."; exit 1; }
          test -n "$DB_PASSWORD" || { echo "::error::Configure SUPABASE_DB_PASSWORD no ambiente production."; exit 1; }

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply audited schema and weather XML schedule migrations
        env:
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

          # Build the IPv4 Session Pooler URI and URL-encode the password.
          SUPABASE_DB_URL="$(DB_PASSWORD="$DB_PASSWORD" python3 -c 'import os, urllib.parse; print("postgresql://postgres.qazvgmgdidjhbvcuinpy:" + urllib.parse.quote(os.environ["DB_PASSWORD"], safe="") + "@aws-1-sa-east-1.pooler.supabase.com:5432/postgres")')"
          export SUPABASE_DB_URL

          apply_migration() {
            local version="$1"
            local name="$2"
            local file="$3"

            local already_applied
            already_applied="$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atc \
              "select 1 from supabase_migrations.schema_migrations where version = '$version' limit 1")"

            if [ "$already_applied" = "1" ]; then
              echo "Migration $version already recorded; skipping."
              return
            fi

            echo "Applying $file"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$file"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c \
              "insert into supabase_migrations.schema_migrations(version, name) values ('$version', '$name') on conflict (version) do nothing"
          }

          apply_migration "20261028180000" "fix_agenda_eventos_schema" "supabase/migrations/20261028180000_fix_agenda_eventos_schema.sql"
          apply_migration "20261028193000" "reconcile_audited_forms_schema_and_storage" "supabase/migrations/20261028193000_reconcile_audited_forms_schema_and_storage.sql"
          apply_migration "20261103210000" "housemix_audit_fixes" "supabase/migrations/20261103210000_housemix_audit_fixes.sql"
          apply_migration "20261103220000" "housemix_performance_indexes" "supabase/migrations/20261103220000_housemix_performance_indexes.sql"
          apply_migration "20261103230000" "housemix_weather_xml_refresh_interval" "supabase/migrations/20261103230000_housemix_weather_xml_refresh_interval.sql"
          apply_migration "20261104130000" "housemix_reports_45d_and_catalog_order" "supabase/migrations/20261104130000_housemix_reports_45d_and_catalog_order.sql"
          apply_migration "20261123182000" "restore_audience_collector_official" "supabase/migrations/20261123182000_restore_audience_collector_official.sql"
          apply_migration "20261123184500" "broadcast_aseguir_45_second_pulses" "supabase/migrations/20261123184500_broadcast_aseguir_45_second_pulses.sql"
          apply_migration "20261123191500" "whatsapp_business_onboarding_credentials" "supabase/migrations/20261123191500_whatsapp_business_onboarding_credentials.sql"
          apply_migration "20261123205000" "hmd_station_shared_device_registry" "supabase/migrations/20261123205000_hmd_station_shared_device_registry.sql"
          apply_migration "20261123232500" "link_bio_pages" "supabase/migrations/20261123232500_link_bio_pages.sql"

      - name: Deploy XML Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          for function_name in serve-xml-geral serve-xml-tempo serve-xml-roteiro-estudio serve-xml-cenarios-estudio serve-xml-broadcast trigger-broadcast-aseguir serve-xml-vmix-live serve-xml-logos serve-xml-enquete serve-xml-batalha serve-xml-quiz collect-audience count-stream-listeners count-video-viewers whatsapp-connect whatsapp-webhook whatsapp-send whatsapp-broadcast update-weather-xml public-cenario-data public-player-data get-music-curiosity; do
            supabase functions deploy "$function_name" --project-ref qazvgmgdidjhbvcuinpy --use-api
          done

      - name: Validar XML real no backend de produção
        run: |
          set -euo pipefail
          URL="https://qazvgmgdidjhbvcuinpy.supabase.co/functions/v1/serve-xml-geral?slug=positiva"
          STATUS="$(curl --silent --show-error --output /tmp/housemix-geral.xml --write-out '%{http_code}' --max-time 45 "$URL")"
          if [ "$STATUS" != "200" ]; then
            echo "::error::serve-xml-geral respondeu HTTP $STATUS em produção."
            head -c 1000 /tmp/housemix-geral.xml || true
            exit 1
          fi
          if ! grep -q '<?xml' /tmp/housemix-geral.xml; then
            echo "::error::A função respondeu HTTP 200, mas não entregou um documento XML válido."
            head -c 1000 /tmp/housemix-geral.xml || true
            exit 1
          fi
          echo "XML geral de produção respondeu HTTP 200 e contém declaração XML."
