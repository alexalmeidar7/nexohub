name: Build Nexo Player Android Native APK

on:
  workflow_dispatch:
    inputs:
      station:
        description: Radio APK
        type: choice
        options: [positiva, interativa, both]
        default: positiva
  push:
    branches:
      - "feature/nexo-player-fire-tv"
      - "feature/nexo-player-android-native"
      - "fix/positiva-tv-entry-visitor-v1-0-1"
      - "fix/positiva-firetv-parallel-install-v1-0-2"
      - "fix/positiva-firetv-reference-login-flow-v1-0-3"
      - "feat/positiva-firetv-native-login-v1-0-4"
      - "fix/positiva-firetv-native-qr-home-splash-v1-0-5"
    paths:
      - "firetv/**"
      - ".github/workflows/build-nexo-player-firetv.yml"
  pull_request:
    paths:
      - "firetv/**"
      - ".github/workflows/build-nexo-player-firetv.yml"

permissions:
  contents: read

jobs:
  build-firetv-apk:
    name: Build Android Native APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Keep sideload signing identity across builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: firetv-debug-signing-v1
      - name: Install image tooling
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Install Positiva FM launcher artwork
        run: |
          test -s public/logos/positiva.png
          mkdir -p firetv/app/src/main/res/mipmap-hdpi firetv/app/src/main/res/drawable-nodpi
          convert public/logos/positiva.png -trim -resize 300x300 -gravity center -background none -extent 432x432 firetv/app/src/main/res/drawable-nodpi/ic_launcher_foreground.png
          convert public/logos/positiva.png -trim -resize 60x60 -gravity center -background '#D50000' -extent 72x72 firetv/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert public/logos/positiva.png -trim -resize 300x300 -gravity center -background none -extent 432x432 firetv/app/src/main/res/drawable-nodpi/positiva_logo.png
      - name: Build shared online Player APK
        working-directory: firetv
        env:
          STATION: ${{ inputs.station || 'both' }}
        run: |
          case "$STATION" in
            positiva) gradle --no-daemon :app:assemblePositivaDebug ;;
            interativa) gradle --no-daemon :app:assembleInterativaDebug ;;
            both) gradle --no-daemon :app:assemblePositivaDebug :app:assembleInterativaDebug ;;
            *) exit 1 ;;
          esac
      - name: Read app version
        id: version
        run: |
          version=$(python3 -c 'import glob,json; versions={e["versionName"] for p in glob.glob("firetv/app/build/outputs/apk/*/debug/output-metadata.json") for e in json.load(open(p))["elements"]}; assert len(versions)==1, versions; print(versions.pop())')
          test -n "$version"
          echo "name=$version" >> "$GITHUB_OUTPUT"
      - name: Name versioned Positiva APK
        run: |
          mkdir -p dist
          if test -f firetv/app/build/outputs/apk/positiva/debug/app-positiva-debug.apk; then
            cp firetv/app/build/outputs/apk/positiva/debug/app-positiva-debug.apk dist/Radio-Positiva-Fire-Android-TV-v${{ steps.version.outputs.name }}.apk
          fi
          if test -f firetv/app/build/outputs/apk/interativa/debug/app-interativa-debug.apk; then
            cp firetv/app/build/outputs/apk/interativa/debug/app-interativa-debug.apk dist/Radio-Interativa-Fire-Android-TV-v${{ steps.version.outputs.name }}.apk
          fi
      - name: Upload versioned APKs
        uses: actions/upload-artifact@v4
        with:
          name: Radio-Fire-Android-TV-v${{ steps.version.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
