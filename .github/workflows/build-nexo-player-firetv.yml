name: Build Nexo Player Android Native APK

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/nexo-player-fire-tv"
      - "feature/nexo-player-android-native"
      - "fix/positiva-tv-entry-visitor-v1-0-1"
    paths:
      - "firetv/**"
      - ".github/workflows/build-nexo-player-firetv.yml"
  pull_request:
    paths:
      - "firetv/**"
      - ".github/workflows/build-nexo-player-firetv.yml"

permissions:
  contents: read

jobs:
  build-firetv-apk:
    name: Build Android Native APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Positiva FM launcher artwork
        run: |
          test -s public/logos/positiva.png
          mkdir -p firetv/app/src/main/res/mipmap-hdpi
          cp public/logos/positiva.png firetv/app/src/main/res/mipmap-hdpi/ic_launcher.png
      - name: Build debug APK
        working-directory: firetv
        run: gradle --no-daemon :app:assemblePositivaDebug :app:assembleInterativaDebug
      - name: Name versioned Positiva APK
        run: |
          mkdir -p dist
          cp firetv/app/build/outputs/apk/positiva/debug/app-positiva-debug.apk dist/Radio-Positiva-Fire-Android-TV-v1.0.1.apk
          cp firetv/app/build/outputs/apk/interativa/debug/app-interativa-debug.apk dist/Radio-Interativa-Fire-Android-TV-v1.0.1.apk
      - name: Upload versioned APKs
        uses: actions/upload-artifact@v4
        with:
          name: Radio-Fire-Android-TV-v1.0.1
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
