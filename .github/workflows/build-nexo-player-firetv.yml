name: Build Nexo Player Android Native APK

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/nexo-player-fire-tv"
      - "feature/nexo-player-android-native"
    paths:
      - "firetv/**"
      - ".github/workflows/build-nexo-player-firetv.yml"
  pull_request:
    paths:
      - "firetv/**"
      - ".github/workflows/build-nexo-player-firetv.yml"

permissions:
  contents: read

jobs:
  build-firetv-apk:
    name: Build Android Native APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: firetv
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexo-player-android-native-debug
          path: firetv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
