name: Build Nexo Player Android Native APK

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/nexo-player-fire-tv"
      - "feature/nexo-player-android-native"
    paths:
      - "firetv/**"
      - ".github/workflows/build-nexo-player-firetv.yml"
  pull_request:
    paths:
      - "firetv/**"
      - ".github/workflows/build-nexo-player-firetv.yml"

permissions:
  contents: read

jobs:
  build-firetv-apk:
    name: Build Android Native APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Positiva FM launcher artwork
        run: |
          mkdir -p firetv/app/src/main/res/mipmap-hdpi
          curl -fL "https://raw.githubusercontent.com/alexalmeidar7/nexohub/main/public/logos/positiva.png" -o firetv/app/src/main/res/mipmap-hdpi/ic_launcher.png
      - name: Build debug APK
        working-directory: firetv
        run: gradle --no-daemon :app:assemblePositivaDebug :app:assembleInterativaDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexo-player-android-native-apks
          path: |
            firetv/app/build/outputs/apk/positiva/debug/app-positiva-debug.apk
            firetv/app/build/outputs/apk/interativa/debug/app-interativa-debug.apk
          if-no-files-found: error
          retention-days: 14
